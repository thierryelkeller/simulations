<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectrum Tuner</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Load FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #f8fafc; /* Tailwind slate-50 */
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* Splash Screen Fade Out */
        .fade-out {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out;
        }

        /* Custom Spectrum Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            position: relative;
            z-index: 10;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 16px;
            cursor: pointer;
            border-radius: 9999px;
            background: linear-gradient(to right, 
                #1a1a1a 0%, #8b0000 20%, #ff0000 35%, #ff7f00 45%, 
                #ffff00 48%, #00ff00 50%, #0000ff 52%, #4b0082 55%, 
                #8a2be2 70%, #00ffff 85%, #ffffff 100%
            );
            border: 1px solid #334155;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        input[type=range]::-webkit-slider-thumb {
            height: 32px;
            width: 32px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -9px;
            border: 3px solid #0f172a;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
            transition: transform 0.1s ease;
        }
        
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.15);
        }

        /* Firefox specific slider styling */
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 16px;
            cursor: pointer;
            border-radius: 9999px;
            background: linear-gradient(to right, #1a1a1a 0%, #8b0000 20%, #ff0000 35%, #ff7f00 45%, #ffff00 48%, #00ff00 50%, #0000ff 52%, #4b0082 55%, #8a2be2 70%, #00ffff 85%, #ffffff 100%);
            border: 1px solid #334155;
        }

        input[type=range]::-moz-range-thumb {
            height: 32px;
            width: 32px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: 3px solid #0f172a;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        canvas {
            display: block;
        }
    </style>
</head>
<body class="min-h-screen text-slate-50 relative">

    <!-- SPLASH SCREEN -->
    <div id="splashScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 transition-opacity duration-700">
        <!-- Canvas for splash background effects -->
        <canvas id="splashCanvas" class="absolute inset-0 z-0 opacity-80"></canvas>
        
        <div class="relative z-10 text-center space-y-8 glass-panel p-10 rounded-3xl max-w-lg w-[90%] shadow-2xl border border-slate-700/50 backdrop-blur-xl">
            <div class="space-y-2">
                <i class="fa-solid fa-wave-square text-5xl text-blue-400 mb-4 animate-pulse"></i>
                <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400">
                    Spectrum Tuner
                </h1>
                <p class="text-slate-400 text-lg">Select language / Choisir la langue / Elegir idioma</p>
            </div>
            
            <div class="flex flex-col gap-4">
                <button onclick="startGame('en')" class="group relative px-6 py-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 transition-all shadow-lg hover:shadow-blue-500/20 overflow-hidden">
                    <span class="relative z-10 text-lg font-bold flex items-center justify-center"><i class="fa-solid fa-earth-americas mr-3 text-blue-400"></i> English</span>
                </button>
                <button onclick="startGame('fr')" class="group relative px-6 py-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 transition-all shadow-lg hover:shadow-purple-500/20 overflow-hidden">
                    <span class="relative z-10 text-lg font-bold flex items-center justify-center"><i class="fa-solid fa-earth-europe mr-3 text-purple-400"></i> Français</span>
                </button>
                <button onclick="startGame('es')" class="group relative px-6 py-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 transition-all shadow-lg hover:shadow-pink-500/20 overflow-hidden">
                    <span class="relative z-10 text-lg font-bold flex items-center justify-center"><i class="fa-solid fa-earth-americas mr-3 text-pink-400"></i> Español</span>
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APPLICATION -->
    <div id="mainApp" class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 opacity-0 hidden transition-opacity duration-1000">
        
        <!-- Header & Language Selector -->
        <div class="w-full max-w-5xl flex justify-between items-start mb-6">
            <header class="text-left space-y-1">
                <h1 id="ui-title" class="text-3xl md:text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400">Spectrum Tuner</h1>
                <p id="ui-subtitle" class="text-slate-400 text-md md:text-lg">Discover the invisible universe.</p>
            </header>
            
            <select id="langSelector" class="bg-slate-800 text-slate-200 border border-slate-600 rounded-lg py-2 pl-4 pr-10 outline-none focus:border-blue-400 transition-colors shadow-lg cursor-pointer">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
            </select>
        </div>

        <div class="w-full max-w-5xl space-y-6">
            
            <div class="glass-panel rounded-3xl p-6 sm:p-8 flex flex-col md:flex-row items-center gap-6 shadow-2xl relative overflow-hidden border border-slate-700/60">
                <div id="categoryGlow" class="absolute inset-0 opacity-20 transition-colors duration-500 blur-3xl pointer-events-none"></div>

                <div class="w-32 h-32 md:w-40 md:h-40 shrink-0 rounded-full flex items-center justify-center bg-slate-800 border-4 border-slate-700 z-10 transition-all duration-300" id="iconContainer">
                    <i id="categoryIcon" class="fa-solid fa-satellite-dish text-5xl md:text-6xl text-slate-300"></i>
                </div>

                <div class="flex-1 space-y-4 z-10 text-center md:text-left w-full">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <h2 id="categoryName" class="text-2xl md:text-3xl font-bold uppercase tracking-widest text-white">Radio Waves</h2>
                        <div class="flex items-center justify-center bg-slate-800/80 rounded-full p-1 border border-slate-700 backdrop-blur-sm">
                            <button id="btnUtility" class="px-4 py-2 rounded-full text-sm font-semibold bg-blue-500 text-white shadow-md transition-all">
                                <i class="fa-solid fa-tools mr-2"></i><span id="ui-btn-utility">Utility</span>
                            </button>
                            <button id="btnSafety" class="px-4 py-2 rounded-full text-sm font-semibold text-slate-400 hover:text-white transition-all">
                                <i class="fa-solid fa-shield-virus mr-2"></i><span id="ui-btn-safety">Safety</span>
                            </button>
                        </div>
                    </div>
                    <div class="bg-slate-900/60 p-4 md:p-5 rounded-xl border border-slate-700/50 min-h-[90px] flex items-center shadow-inner">
                        <p id="descriptionText" class="text-slate-200 text-base md:text-lg leading-relaxed"></p>
                    </div>
                </div>
            </div>

            <div class="glass-panel rounded-2xl p-4 shadow-xl relative overflow-hidden border border-slate-700/60">
                <div class="absolute top-3 left-4 text-xs font-bold text-slate-400 uppercase tracking-widest z-10"><i class="fa-solid fa-chart-line mr-2"></i> <span id="ui-wave-vis">Wave Visualization</span></div>
                <div class="w-full h-32 md:h-40 rounded-xl overflow-hidden bg-slate-900/80 border border-slate-800 relative">
                    <div id="waveCanvasGlow" class="absolute inset-0 opacity-30 blur-2xl transition-colors duration-300"></div>
                    <canvas id="waveCanvas" class="w-full h-full relative z-10"></canvas>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                <div class="glass-panel rounded-2xl p-5 flex flex-col items-center justify-center text-center space-y-2 relative overflow-hidden">
                    <div class="text-slate-400 text-sm font-semibold uppercase flex items-center z-10"><i class="fa-solid fa-ruler-horizontal mr-2 text-blue-400"></i> <span id="ui-wavelength">Wavelength (λ)</span></div>
                    <div class="text-2xl font-mono font-bold text-blue-300 z-10" id="valWavelength"></div>
                    <div class="text-xs text-blue-200/60 z-10 font-mono" id="valWavelengthRaw"></div>
                    <div class="mt-3 w-full bg-slate-900/60 rounded-xl p-2 flex flex-col items-center justify-center border border-slate-700/50 z-10">
                        <span id="ui-size-text" class="text-[10px] uppercase text-slate-400 font-bold mb-1">Scale:</span>
                        <div class="flex items-center gap-2"><i id="sizeIcon" class="fa-solid fa-mountain text-blue-400 text-lg"></i> <span id="sizeName" class="text-sm font-semibold"></span></div>
                    </div>
                </div>
                <div class="glass-panel rounded-2xl p-5 flex flex-col items-center justify-center text-center space-y-2 relative overflow-hidden">
                    <div class="text-slate-400 text-sm font-semibold uppercase flex items-center z-10"><i class="fa-solid fa-wave-square mr-2 text-purple-400"></i> <span id="ui-frequency">Frequency (f)</span></div>
                    <div class="text-2xl font-mono font-bold text-purple-300 z-10" id="valFrequency"></div>
                    <div class="text-xs text-purple-200/60 z-10 font-mono" id="valFrequencyRaw"></div>
                </div>
                <div class="glass-panel rounded-2xl p-5 flex flex-col items-center justify-center text-center space-y-2 relative overflow-hidden">
                    <div class="text-slate-400 text-sm font-semibold uppercase flex items-center z-10"><i class="fa-solid fa-bolt mr-2 text-yellow-400"></i> <span id="ui-energy">Energy Level</span></div>
                    <div class="text-xl font-bold text-green-400 z-10" id="valEnergyText"></div>
                    <div class="w-full bg-slate-800 h-3 rounded-full mt-2 overflow-hidden z-10 border border-slate-700"><div id="energyBar" class="bg-gradient-to-r from-green-400 via-yellow-400 to-red-600 h-full w-[5%] transition-all"></div></div>
                </div>
            </div>

            <div class="glass-panel rounded-3xl p-6 md:p-8 space-y-4 shadow-xl border border-slate-700/60 relative">
                <input type="range" min="0" max="100" value="0" step="0.1" id="spectrumSlider">
                <div id="sliderMarkers" class="relative w-full h-10 mt-1 flex text-[9px] md:text-[11px] font-bold text-slate-500 uppercase tracking-wider"></div>
            </div>
        </div>
    </div>

    <script>
        const I18N = {
            en: { title: "Spectrum Tuner", subtitle: "Discover the invisible universe.", btnUtility: "Utility", btnSafety: "Safety", waveVis: "Wave Visualization", wavelength: "Wavelength (λ)", frequency: "Frequency (f)", energy: "Energy Level", energyLevels: ["Very Low", "Low", "Moderate", "High (Ionizing)", "Extreme Hazard"], units: { khz: "kHz", mhz: "MHz", ghz: "GHz", thz: "THz", ehf: "EHF" } },
            fr: { title: "Syntoniseur de Spectre", subtitle: "Découvrez l'univers invisible.", btnUtility: "Utilité", btnSafety: "Sécurité", waveVis: "Visualisation de l'Onde", wavelength: "Longueur d'onde (λ)", frequency: "Fréquence (f)", energy: "Niveau d'Énergie", energyLevels: ["Très Faible", "Faible", "Modéré", "Élevé (Ionisant)", "Danger Extrême"], units: { khz: "kHz", mhz: "MHz", ghz: "GHz", thz: "THz", ehf: "F.E.H" } },
            es: { title: "Sintonizador de Espectro", subtitle: "Descubre el universo invisible.", btnUtility: "Utilidad", btnSafety: "Seguridad", waveVis: "Visualización de Onda", wavelength: "Longitud de onda (λ)", frequency: "Frecuencia (f)", energy: "Nivel de Energía", energyLevels: ["Muy Bajo", "Bajo", "Moderado", "Alto (Ionizante)", "Peligro Extremo"], units: { khz: "kHz", mhz: "MHz", ghz: "GHz", thz: "THz", ehf: "F.E.A" } }
        };

        const SPECTRUM_DATA = [
            { id: 'radio', threshold: 15, color: '#ef4444', name: { en: 'Radio', fr: 'Radio', es: 'Radio' }, iconUtility: 'fa-satellite-dish', iconSafety: 'fa-thumbs-up', descUtility: { en: "Long-distance communication.", fr: "Communication longue distance.", es: "Comunicación a larga distancia." }, descSafety: { en: "Non-ionizing, harmless.", fr: "Non-ionisant, sans danger.", es: "No ionizante, inofensivo." } },
            { id: 'microwave', threshold: 30, color: '#f97316', name: { en: 'Microwave', fr: 'Micro-onde', es: 'Microondas' }, iconUtility: 'fa-wifi', iconSafety: 'fa-temperature-arrow-up', descUtility: { en: "Wi-Fi, radar, cooking.", fr: "Wi-Fi, radar, cuisson.", es: "Wi-Fi, radar, cocina." }, descSafety: { en: "Can cause heating.", fr: "Peut causer de la chaleur.", es: "Puede causar calor." } },
            { id: 'infrared', threshold: 45, color: '#eab308', name: { en: 'Infrared', fr: 'Infrarouge', es: 'Infrarrojo' }, iconUtility: 'fa-fire', iconSafety: 'fa-temperature-half', descUtility: { en: "Thermal imaging.", fr: "Imagerie thermique.", es: "Cámaras térmicas." }, descSafety: { en: "Felt as warmth.", fr: "Ressenti comme chaleur.", es: "Sentido como calor." } },
            { id: 'visible', threshold: 55, color: '#22c55e', name: { en: 'Visible', fr: 'Visible', es: 'Visible' }, iconUtility: 'fa-eye', iconSafety: 'fa-sun', descUtility: { en: "What we see.", fr: "Ce que nous voyons.", es: "Lo que vemos." }, descSafety: { en: "Safe.", fr: "Sûr.", es: "Seguro." } },
            { id: 'ultraviolet', threshold: 70, color: '#3b82f6', name: { en: 'UV', fr: 'UV', es: 'UV' }, iconUtility: 'fa-microscope', iconSafety: 'fa-triangle-exclamation', descUtility: { en: "Sterilization.", fr: "Stérilisation.", es: "Esterilización." }, descSafety: { en: "Ionizing, sunburn risk.", fr: "Ionisant, coup de soleil.", es: "Ionizante, riesgo de quemaduras." } },
            { id: 'xray', threshold: 85, color: '#a855f7', name: { en: 'X-Ray', fr: 'Rayons X', es: 'Rayos X' }, iconUtility: 'fa-x-ray', iconSafety: 'fa-skull-crossbones', descUtility: { en: "Medical imaging.", fr: "Imagerie médicale.", es: "Imágenes médicas." }, descSafety: { en: "Highly ionizing.", fr: "Hautement ionisant.", es: "Altamente ionizante." } },
            { id: 'gamma', threshold: 100, color: '#ffffff', name: { en: 'Gamma', fr: 'Gamma', es: 'Gamma' }, iconUtility: 'fa-atom', iconSafety: 'fa-radiation', descUtility: { en: "Nuclear energy.", fr: "Énergie nucléaire.", es: "Energía nuclear." }, descSafety: { en: "Extreme danger.", fr: "Danger extrême.", es: "Peligro extremo." } }
        ];

        const SCALE_DATA = [
            { threshold: 1000, icon: 'fa-mountain', name: { en: 'Mountain', fr: 'Montagne', es: 'Montaña' } },
            { threshold: 10, icon: 'fa-house', name: { en: 'House', fr: 'Maison', es: 'Casa' } },
            { threshold: 1, icon: 'fa-person', name: { en: 'Human', fr: 'Humain', es: 'Humano' } },
            { threshold: 0.01, icon: 'fa-circle', name: { en: 'Marble', fr: 'Bille', es: 'Canica' } },
            { threshold: 0.001, icon: 'fa-bug', name: { en: 'Ant', fr: 'Fourmi', es: 'Hormiga' } },
            { threshold: 1e-5, icon: 'fa-disease', name: { en: 'Cell', fr: 'Cellule', es: 'Célula' } },
            { threshold: 1e-7, icon: 'fa-virus', name: { en: 'Virus', fr: 'Virus', es: 'Virus' } },
            { threshold: 1e-10, icon: 'fa-atom', name: { en: 'Atom', fr: 'Atome', es: 'Átomo' } }
        ];

        let currentLang = 'en', currentMode = 'utility', waveTime = 0, targetWavelength = 150, targetFrequency = 0.05, targetAmplitude = 30, waveHexColor = '#ef4444';
        
        // Splash setup
        const canvas = document.getElementById('splashCanvas'), ctx = canvas.getContext('2d');
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        window.addEventListener('mousemove', e => { mouse = { x: e.clientX, y: e.clientY }; });

        function draw() {
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#a855f7'];
            for(let i=0; i<colors.length; i++) {
                ctx.beginPath(); ctx.strokeStyle = colors[i]; ctx.lineWidth = 4;
                for(let x=0; x<canvas.width; x+=10) {
                    let y = canvas.height/2 + Math.sin(x*0.005 + waveTime + i) * 80 + Math.sin(mouse.x*0.002) * (mouse.y - canvas.height/2) * 0.1;
                    if(x===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            waveTime += 0.02;
            requestAnimationFrame(draw);
        }
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize(); draw();

        // Main App logic
        function updateUI() {
            const val = parseFloat(document.getElementById('spectrumSlider').value);
            const dict = I18N[currentLang];
            const exp = 4 - (val/100) * 17;
            const lambda = Math.pow(10, exp);
            const f = 299792458 / lambda;
            
            // UI updates
            document.getElementById('valWavelength').innerHTML = lambda.toExponential(1) + " m";
            const cat = SPECTRUM_DATA.find((c, i) => val <= c.threshold || i === SPECTRUM_DATA.length - 1);
            document.getElementById('categoryName').innerText = cat.name[currentLang];
            document.getElementById('descriptionText').innerText = currentMode === 'utility' ? cat.descUtility[currentLang] : cat.descSafety[currentLang];
            
            // Size scale
            const scale = SCALE_DATA.find(s => lambda >= s.threshold) || SCALE_DATA[SCALE_DATA.length-1];
            document.getElementById('sizeIcon').className = `fa-solid ${scale.icon} text-blue-400 text-lg`;
            document.getElementById('sizeName').innerText = scale.name[currentLang];

            // Wave Canvas params
            waveHexColor = cat.color;
            targetWavelength = 100 - (val/100)*80;
            targetFrequency = 0.05 + (val/100)*0.5;
        }

        // Wave Canvas Loop
        const wCanvas = document.getElementById('waveCanvas'), wCtx = wCanvas.getContext('2d');
        function animateWave() {
            wCtx.clearRect(0,0, wCanvas.width, wCanvas.height);
            wCtx.beginPath(); wCtx.strokeStyle = waveHexColor; wCtx.lineWidth = 4;
            for(let x=0; x<wCanvas.width; x++) {
                let y = wCanvas.height/2 + Math.sin(x/targetWavelength + waveTime*targetFrequency) * 40;
                if(x===0) wCtx.moveTo(x,y); else wCtx.lineTo(x,y);
            }
            wCtx.stroke();
            requestAnimationFrame(animateWave);
        }
        
        function startGame(lang) {
            currentLang = lang; document.getElementById('splashScreen').classList.add('fade-out');
            document.getElementById('mainApp').classList.remove('hidden');
            setTimeout(() => document.getElementById('mainApp').classList.remove('opacity-0'), 100);
            updateUI(); animateWave();
        }

        document.getElementById('spectrumSlider').addEventListener('input', updateUI);
    </script>
</body>
</html>
