        const SUN_ORBIT_RADIUS = 100;

        // --- ASTRONOMY MATH ENGINE ---
        const getSolarPosition = (dayOfYear, timeOfDay, latitude) => {
            const rad = Math.PI / 180;
            const latRad = latitude * rad;
            const decDeg = 23.45 * Math.sin((360 / 365) * (dayOfYear - 81) * rad);
            const decRad = decDeg * rad;
            const haDeg = 15 * (timeOfDay - 12);
            const haRad = haDeg * rad;

            const sinAlt = Math.sin(latRad) * Math.sin(decRad) + Math.cos(latRad) * Math.cos(decRad) * Math.cos(haRad);
            const altRad = Math.asin(sinAlt);
            const altDeg = altRad / rad;

            let cosAz = (Math.sin(decRad) - Math.sin(altRad) * Math.sin(latRad)) / (Math.cos(altRad) * Math.cos(latRad));
            cosAz = Math.max(-1, Math.min(1, cosAz)); 
            let azRad = Math.acos(cosAz);
            let azDeg = azRad / rad;
            if (timeOfDay > 12) azDeg = 360 - azDeg;

            return { altitude: altDeg, azimuth: azDeg, declination: decDeg };
        };

        // --- 3D INTERACTIVE MEASUREMENT HELPERS ---
        const getMeasuredAngle = (start, end, lat) => {
            const dx = end.x - start.x;
            const dz = end.z - start.z;
            let angleRad;
            if (lat >= 0) {
                angleRad = Math.atan2(dx, -dz);
            } else {
                angleRad = Math.atan2(-dx, dz);
            }
            let angleDeg = angleRad * (180 / Math.PI);
            if (angleDeg < 0) angleDeg += 360;
            return angleDeg;
        };

                    else if (altitude > -5) { const l = (altitude + 5) / 7; tColor.lerpColors(duskTop, twilightTop, l); bColor.lerpColors(duskBottom, twilightBottom, l); if(starsMatRef.current) starsMatRef.current.opacity = 0.45 + (1 - l) * 0.55; }
                    else { tColor.copy(nightTop); bColor.copy(nightBottom); if(starsMatRef.current) starsMatRef.current.opacity = 1.0; }
                    skyMatRef.current.uniforms.topColor.value.copy(tColor); skyMatRef.current.uniforms.bottomColor.value.copy(bColor);
                }

                if (trajectoryRef.current) {
                    const points = [];
                    for (let ts = 0; ts <= 24; ts += 0.25) { 
                        const solar = getSolarPosition(day, ts, latitude);
                        const aR = solar.altitude * (Math.PI / 180); const zR = solar.azimuth * (Math.PI / 180);
                        const pY = SUN_ORBIT_RADIUS * Math.sin(aR); const gD = SUN_ORBIT_RADIUS * Math.cos(aR);
                        points.push(new THREE.Vector3(gD * Math.sin(zR), pY, -gD * Math.cos(zR)));
                    }
                    trajectoryRef.current.geometry.setFromPoints(points); trajectoryRef.current.computeLineDistances(); 
                }

                if (stickDialRef.current && horizontalDialRef.current && equatorialDialRef.current) {
                    stickDialRef.current.visible = sundialType === 'stick'; horizontalDialRef.current.group.visible = sundialType === 'horizontal'; equatorialDialRef.current.group.visible = sundialType === 'equatorial';
                    if (sundialType === 'horizontal') {
                        const { gnomon } = horizontalDialRef.current; const latRad = latitude * (Math.PI / 180);
                        gnomon.position.set(0, 0, 0); gnomon.rotation.set(0, 0, 0);
                        gnomon.position.y = (5 / 2) * Math.sin(latRad); gnomon.position.z = -(5 / 2) * Math.cos(latRad); gnomon.rotation.x = - (Math.PI / 2 - latRad); 
                    }
                    if (sundialType === 'equatorial') equatorialDialRef.current.pivot.rotation.x = - (Math.PI / 2 - (latitude * Math.PI / 180));
                }
            }, [time, day, latitude, sundialType, mode]);

            return (
                <div className="w-full h-full relative flex">
                    <div className="absolute inset-0 z-0" ref={mountRef}></div>
                    <div className="absolute top-0 left-0 w-full p-4 z-10 flex justify-between items-start pointer-events-none">
                        <div className="flex gap-2 pointer-events-auto">
                            <button onClick={onBack} className="bg-slate-900/80 hover:bg-slate-800 text-white px-4 py-2 rounded-lg backdrop-blur-sm border border-slate-700 transition-colors shadow-lg text-sm font-semibold">← {t('back')}</button>
                            <button onClick={onShowInstructions} className="bg-slate-900/80 hover:bg-slate-800 text-white p-2 rounded-lg backdrop-blur-sm border border-slate-700 transition-colors shadow-lg"><Info className="w-5 h-5" /></button>
                        </div>
                        <div className="pointer-events-auto flex items-center gap-3">
                            <div className="hidden md:flex bg-slate-900/70 text-white/90 px-4 py-2 rounded-full text-xs backdrop-blur-sm items-center gap-2 shadow-lg border border-slate-700/50"><Navigation className="w-3.5 h-3.5 text-sky-400" />{t('drag_hint')}</div>
                            <div className="bg-slate-900/80 backdrop-blur-sm border border-slate-700 p-1 rounded-lg flex gap-1 shadow-lg text-xs font-bold">
                                {['en', 'fr', 'es'].map(l => (
                                    <button key={l} onClick={() => setLang(l)} className={`px-2 py-1 rounded transition-colors ${lang === l ? 'bg-amber-500 text-slate-950' : 'text-slate-300 hover:text-white'}`}>{l.toUpperCase()}</button>
                                ))}
                            </div>
                        </div>
                    </div>
                    {mode === 'elementary' ? (
                        <ElementaryUI time={time} setTime={setTime} day={day} setDay={setDay} t={t} solarData={solarData} />
                    ) : (
                        <MiddleSchoolUI time={time} setTime={setTime} day={day} setDay={setDay} latitude={latitude} setLatitude={setLatitude} sundialType={sundialType} setSundialType={setSundialType} showRuler={showRuler} setShowRuler={setShowRuler} showProtractor={showProtractor} setShowProtractor={setShowProtractor} userRulerLength={userRulerLength} userShadowAngle={userShadowAngle} t={t} solarData={solarData} />
                    )}
                    {showModal && (
                        <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <div className="max-w-md w-full bg-slate-900 border border-slate-700 p-6 rounded-3xl shadow-2xl space-y-4">
                                <h3 className="text-2xl font-bold text-white text-center flex items-center justify-center gap-2"><Info className="w-6 h-6 text-amber-400" />{mode === 'elementary' ? t('elem_instr_title') : t('mid_instr_title')}</h3>
                                <ul className="space-y-3 text-slate-300 text-sm">
                                    {[1, 2, 3, 4].map(n => (
                                        <li key={n} className="flex gap-2"><span className="text-amber-400 font-bold">{n}.</span><span>{mode === 'elementary' ? t(`elem_instr_${n}`) : t(`mid_instr_${n}`)}</span></li>
                                    ))}
                                </ul>
                                <button onClick={() => setShowModal(false)} className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl transition-all shadow-md active:scale-95">OK</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function ElementaryUI({ time, setTime, day, setDay, t, solarData }) {
            const isNight = solarData.altitude <= 0;
            let sunHeightText = t('low'); if (solarData.altitude > 45) sunHeightText = t('high'); if (isNight) sunHeightText = t('below_horizon');
            return (
                <div className="absolute bottom-4 left-1/2 -translate-x-1/2 z-10 w-[95%] max-w-xl pointer-events-auto">
                    <div className="bg-white/95 border border-white p-4 rounded-3xl shadow-2xl backdrop-blur-md flex flex-col gap-3 text-slate-800">
                        <div className="grid grid-cols-2 gap-4 items-center border-b border-slate-200 pb-3">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-slate-100 rounded-2xl flex items-center justify-center border border-slate-200 shadow-sm">{isNight ? <Moon className="text-slate-500 w-5 h-5" /> : <Sun className="w-5 h-5 text-amber-500 animate-[spin_10s_linear_infinite]" />}</div>
                                <div><div className="text-[10px] uppercase tracking-wider text-slate-400 font-bold">{t('sun_height')}</div><div className="text-sm font-extrabold text-amber-600">{sunHeightText}</div></div>
                            </div>
                            <div className="flex flex-col gap-1">
                                <div className="text-[10px] uppercase tracking-wider text-slate-400 font-bold flex items-center gap-1"><Calendar className="w-3 h-3 text-amber-500" /> {t('seasons')}</div>
                                <div className="grid grid-cols-4 gap-1">
                                    <button onClick={() => setDay(80)} className={`py-1.5 px-0.5 rounded-lg text-[10px] font-extrabold transition-all border shadow-sm ${day === 80 ? 'bg-emerald-100 border-emerald-400 text-emerald-800 scale-105' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>🌱 {t('spring')}</button>
                                    <button onClick={() => setDay(172)} className={`py-1.5 px-0.5 rounded-lg text-[10px] font-extrabold transition-all border shadow-sm ${day === 172 ? 'bg-amber-100 border-amber-400 text-amber-800 scale-105' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>☀️ {t('summer')}</button>
                                    <button onClick={() => setDay(264)} className={`py-1.5 px-0.5 rounded-lg text-[10px] font-extrabold transition-all border shadow-sm ${day === 264 ? 'bg-orange-100 border-orange-400 text-orange-800 scale-105' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>🍁 {t('autumn')}</button>
                                    <button onClick={() => setDay(355)} className={`py-1.5 px-0.5 rounded-lg text-[10px] font-extrabold transition-all border shadow-sm ${day === 355 ? 'bg-sky-100 border-sky-400 text-sky-800 scale-105' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>❄️ {t('winter')}</button>
                                </div>
                            </div>
                        </div>
                        <div className="grid grid-cols-5 gap-1.5">
                            <button onClick={() => setTime(6)} className={`flex flex-col items-center py-2 px-1 rounded-xl transition-all border shadow-sm ${time >= 5 && time < 8 ? 'bg-sky-100 border-sky-400 text-sky-700' : 'bg-slate-50 border-slate-200 text-slate-500'}`}><Sunrise className="w-4 h-4 mb-0.5 text-sky-500" /><span className="text-[9px] font-extrabold leading-none">{t('early_morning')}</span></button>
                            <button onClick={() => setTime(9)} className={`flex flex-col items-center py-2 px-1 rounded-xl transition-all border shadow-sm ${time >= 8 && time < 11 ? 'bg-amber-100 border-amber-400 text-amber-700' : 'bg-slate-50 border-slate-200 text-slate-500'}`}><Sun className="w-4 h-4 mb-0.5 text-amber-500" /><span className="text-[9px] font-extrabold leading-none">{t('mid_morning')}</span></button>
                            <button onClick={() => setTime(12)} className={`flex flex-col items-center py-2 px-1 rounded-xl transition-all border shadow-sm ${time >= 11 && time <= 13 ? 'bg-amber-200/50 border-amber-500 text-amber-800 font-black' : 'bg-slate-50 border-slate-200 text-slate-500'}`}><Sun className="w-4 h-4 mb-0.5 text-amber-600" /><span className="text-[9px] font-extrabold leading-none">{t('noon')}</span></button>
                            <button onClick={() => setTime(15)} className={`flex flex-col items-center py-2 px-1 rounded-xl transition-all border shadow-sm ${time > 13 && time <= 16 ? 'bg-orange-100 border-orange-400 text-orange-700' : 'bg-slate-50 border-slate-200 text-slate-500'}`}><Sun className="w-4 h-4 mb-0.5 text-orange-500" /><span className="text-[9px] font-extrabold leading-none">{t('afternoon')}</span></button>
                            <button onClick={() => setTime(18)} className={`flex flex-col items-center py-2 px-1 rounded-xl transition-all border shadow-sm ${time > 16 && time <= 20 ? 'bg-orange-100 border-orange-500 text-orange-800' : 'bg-slate-50 border-slate-200 text-slate-500'}`}><Sunset className="w-4 h-4 mb-0.5 text-orange-600" /><span className="text-[9px] font-extrabold leading-none">{t('evening')}</span></button>
                        </div>
                        <div className="flex items-center gap-3 px-1 pt-1"><Clock className="w-4 h-4 text-sky-500 shrink-0" /><input type="range" min="0" max="24" step="0.1" value={time} onChange={(e) => setTime(parseFloat(e.target.value))} className="w-full h-3 bg-slate-100 rounded-full appearance-none cursor-pointer accent-amber-500 shadow-inner" /></div>
                    </div>
                </div>
            );
        }

        function MiddleSchoolUI({ time, setTime, day, setDay, latitude, setLatitude, sundialType, setSundialType, showRuler, setShowRuler, showProtractor, setShowProtractor, userRulerLength, userShadowAngle, t, solarData }) {
            const formatTime = (dh) => `${Math.floor(dh).toString().padStart(2, '0')}:${Math.round((dh - Math.floor(dh)) * 60).toString().padStart(2, '0')}`;
            const getMonth = (d) => new Date(2023, 0, d).toLocaleString('default', { month: 'short', day: 'numeric' });
            
            // True Heights: Straight stick was changed to exactly 1.0 (Body 0.9 + Tip 0.1) 
            const activeHeight = sundialType === 'stick' ? 1.0 : (sundialType === 'horizontal' ? 3.5 : 4.5);
            const rawShadowLen = solarData.altitude > 0 ? (activeHeight / Math.tan(solarData.altitude * (Math.PI / 180))) : 0;
            const calculatedShadowVal = (solarData.altitude > 0 && isFinite(rawShadowLen)) ? rawShadowLen.toFixed(2) + "m" : '∞';
            const rawShadowAngle = (solarData.azimuth + 180) % 360;
            const targetUserAngle = latitude >= 0 ? rawShadowAngle : (rawShadowAngle + 180) % 360;

            const isAngleMatched = solarData.altitude > 0 && (Math.abs(userShadowAngle - targetUserAngle) < 5 || Math.abs(userShadowAngle - targetUserAngle) > 355);
            const isLengthMatched = solarData.altitude > 0 && Math.abs(userRulerLength - rawShadowLen) < 0.4;
            const showMatchBadge = showRuler && showProtractor && isAngleMatched && isLengthMatched;

            return (
                <>
                    <div className="absolute top-20 left-6 z-10 w-80 bg-slate-900/85 backdrop-blur-md p-6 rounded-2xl border border-slate-700 shadow-2xl pointer-events-auto flex flex-col gap-6 max-h-[82vh] overflow-y-auto">
                        <div><div className="flex justify-between mb-2"><label className="text-xs font-bold text-sky-300 uppercase tracking-wider flex items-center gap-2"><Clock className="w-4 h-4" /> {t('time_of_day')}</label><span className="font-mono bg-slate-800 px-2 rounded text-xs text-sky-100">{formatTime(time)}</span></div><input type="range" min="0" max="24" step="0.25" value={time} onChange={(e) => setTime(parseFloat(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-500" /></div>
                        <div><div className="flex justify-between mb-2"><label className="text-xs font-bold text-amber-300 uppercase tracking-wider flex items-center gap-2"><BookOpen className="w-4 h-4" /> {t('day_of_year')}</label><span className="font-mono bg-slate-800 px-2 rounded text-xs text-amber-100">{getMonth(day)}</span></div><input type="range" min="1" max="365" step="1" value={day} onChange={(e) => setDay(parseInt(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-amber-500" /></div>
                        <div><div className="flex justify-between mb-2"><label className="text-xs font-bold text-emerald-300 uppercase tracking-wider flex items-center gap-2"><Globe className="w-4 h-4" /> {t('latitude')}</label><span className="font-mono bg-slate-800 px-2 rounded text-xs text-emerald-100">{latitude}°</span></div><input type="range" min="-90" max="90" step="1" value={latitude} onChange={(e) => setLatitude(parseInt(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500" /><div className="flex justify-between text-[10px] text-slate-500 mt-1 font-bold"><span>90°S</span><span>0°</span><span>90°N</span></div></div>
                        <hr className="border-slate-700" />
                        <div>
                            <label className="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2 mb-3"><Layers className="w-4 h-4" /> {t('sundial_type')}</label>
                            <div className="flex flex-col gap-2">
                                <button onClick={() => setSundialType('stick')} className={`px-3 py-2 text-xs text-left rounded-lg transition-colors font-bold border ${sundialType === 'stick' ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}>{t('stick')}</button>
                                <button onClick={() => setSundialType('horizontal')} className={`px-3 py-2 text-xs text-left rounded-lg transition-colors font-bold border ${sundialType === 'horizontal' ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}>{t('horizontal')}</button>
                                <button onClick={() => setSundialType('equatorial')} className={`px-3 py-2 text-xs text-left rounded-lg transition-colors font-bold border ${sundialType === 'equatorial' ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}>{t('equatorial')}</button>
                            </div>
                        </div>
                        <hr className="border-slate-700" />
                        <div>
                            <label className="text-xs font-bold text-pink-400 uppercase tracking-wider flex items-center gap-2 mb-3"><Ruler className="w-4 h-4" /> {t('measure_tools')}</label>
                            <div className="flex flex-col gap-2">
                                <button onClick={() => setShowRuler(!showRuler)} className={`px-3 py-2 text-xs text-left rounded-lg transition-colors font-bold border flex justify-between items-center ${showRuler ? 'bg-pink-600/20 border-pink-500 text-pink-200' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}><span>{t('ruler_tool')}</span><span className={`w-2.5 h-2.5 rounded-full ${showRuler ? 'bg-pink-400 animate-pulse' : 'bg-slate-600'}`}></span></button>
                                <button onClick={() => setShowProtractor(!showProtractor)} className={`px-3 py-2 text-xs text-left rounded-lg transition-colors font-bold border flex justify-between items-center ${showProtractor ? 'bg-blue-600/20 border-blue-500 text-blue-200' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}><span>{t('protractor_tool')}</span><span className={`w-2.5 h-2.5 rounded-full ${showProtractor ? 'bg-blue-400 animate-pulse' : 'bg-slate-600'}`}></span></button>
                            </div>
                        </div>
                    </div>

                    <div className="absolute top-20 right-6 z-10 w-72 bg-slate-900/85 backdrop-blur-md p-5 rounded-2xl border border-slate-700 shadow-2xl pointer-events-auto flex flex-col gap-5">
                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest border-b border-slate-700 pb-2">Live Data & Measures</h3>
                        <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-2">
                                <div><div className="text-[10px] text-slate-500 uppercase font-bold">{t('altitude')}</div><div className={`text-2xl font-mono font-bold ${solarData.altitude > 0 ? 'text-amber-400' : 'text-slate-600'}`}>{solarData.altitude > 0 ? solarData.altitude.toFixed(1) : 0}°</div></div>
                                <div><div className="text-[10px] text-slate-500 uppercase font-bold">{t('azimuth')}</div><div className="text-2xl font-mono font-bold text-sky-400">{solarData.azimuth.toFixed(1)}°</div></div>
                            </div>

                            {(showRuler || showProtractor) && (
                                <div className="bg-slate-800/60 p-3 rounded-xl border border-slate-700/50 space-y-4">
                                    <span className="text-[10px] text-amber-300 font-bold uppercase tracking-wider block">{t('measure_hint')}</span>
                                    
                                    <div className="space-y-2 text-xs">
                                        {showRuler && (
                                            <div className="flex justify-between font-semibold">
                                                <span className="text-slate-400">{t('align_ruler')}</span>
                                                <span className="font-mono text-pink-400 font-bold">{userRulerLength.toFixed(2)}m</span>
                                            </div>
                                        )}
                                        {showProtractor && (
                                            <div className="flex justify-between font-semibold">
                                                <span className="text-slate-400">{t('align_protractor')}</span>
                                                <span className="font-mono text-blue-400 font-bold">{userShadowAngle.toFixed(1)}°</span>
                                            </div>
                                        )}
                                    </div>
                                    
                                    {showMatchBadge && (
                                        <div className="bg-emerald-500/20 border border-emerald-500 p-2 rounded-lg flex items-center justify-center gap-2 text-emerald-300 text-xs font-bold animate-bounce"><CheckCircle className="w-4 h-4" /><span>{t('measure_match')}</span></div>
                                    )}
                                </div>
                            )}

                            <div className="pt-2 border-t border-slate-700 space-y-3 opacity-60">
                                <div><div className="text-[10px] text-slate-500 uppercase font-bold">{t('shadow_len')} (Math. Calc)</div><div className={`text-xl font-mono font-bold mt-1 ${solarData.altitude > 0 ? 'text-emerald-400' : 'text-slate-600'}`}>{calculatedShadowVal}</div></div>
                                <div><div className="text-[10px] text-slate-500 uppercase font-bold">{t('shadow_angle')} {latitude >= 0 ? t('from_north') : t('from_south')}</div><div className={`text-xl font-mono font-bold mt-1 ${solarData.altitude > 0 ? 'text-pink-400' : 'text-slate-600'}`}>{solarData.altitude > 0 ? `${targetUserAngle.toFixed(1)}°` : '—'}</div></div>
                            </div>
                        </div>
                    </div>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
