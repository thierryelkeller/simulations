        const SUN_ORBIT_RADIUS = 95; 

        const formatTime24 = (t) => {
            const h = Math.floor(t);
            const m = Math.floor((t - h) * 60).toString().padStart(2, '0');
            return `${h.toString().padStart(2, '0')}:${m}`;
        };

        const formatTimeAmPm = (t) => {
            const h = Math.floor(t);
            const m = Math.floor((t - h) * 60).toString().padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            const h12 = h % 12 || 12;
            return `${h12}:${m} ${ampm}`;
        };

        // --- ASTRONOMY MATH ENGINE ---
        const getSolarPosition = (dayOfYear, timeOfDay, latitude) => {
            const rad = Math.PI / 180;
            const latRad = latitude * rad;
            const decDeg = 23.45 * Math.sin((360 / 365) * (dayOfYear - 81) * rad);
            const decRad = decDeg * rad;
            const haDeg = 15 * (timeOfDay - 12);
            const haRad = haDeg * rad;

            const sinAlt = Math.sin(latRad) * Math.sin(decRad) + Math.cos(latRad) * Math.cos(decRad) * Math.cos(haRad);
            const altRad = Math.asin(sinAlt);
            const altDeg = altRad / rad;

            let cosAz = (Math.sin(decRad) - Math.sin(altRad) * Math.sin(latRad)) / (Math.cos(altRad) * Math.cos(latRad));
            cosAz = Math.max(-1, Math.min(1, cosAz)); 
            let azRad = Math.acos(cosAz);
            let azDeg = azRad / rad;
            if (timeOfDay > 12) azDeg = 360 - azDeg;

            return { altitude: altDeg, azimuth: azDeg, declination: decDeg };
        };

        // --- 3D INTERACTIVE MEASUREMENT HELPERS ---
        const getMeasuredAngle = (start, end, lat) => {
            const dx = end.x - start.x;
            const dz = end.z - start.z;
            let angleRad = lat >= 0 ? Math.atan2(dx, -dz) : Math.atan2(-dx, dz);
            let angleDeg = angleRad * (180 / Math.PI);
            if (angleDeg < 0) angleDeg += 360;
            return angleDeg;
        };

        const connectPointsWithCylinder = (pointA, pointB, radius, material) => {
            const direction = new THREE.Vector3().subVectors(pointB, pointA);
            const length = direction.length();
            const geometry = new THREE.CylinderGeometry(radius, radius, length, 8);
            const mesh = new THREE.Mesh(geometry, material);
            const midpoint = new THREE.Vector3().addVectors(pointA, pointB).multiplyScalar(0.5);
            mesh.position.copy(midpoint); mesh.position.y = 0.05;
            const up = new THREE.Vector3(0, 1, 0);
            mesh.quaternion.setFromUnitVectors(up, direction.clone().normalize());
            return mesh;
        };

        const createLocalProtractor = (center, endPoint, lat) => {
            const dx = endPoint.x - center.x; const dz = endPoint.z - center.z;
            const angleRad = lat >= 0 ? Math.atan2(dx, -dz) : Math.atan2(-dx, dz);
            
            let startTheta, lengthTheta;
            if (lat >= 0) {
                if (angleRad >= 0) { startTheta = Math.PI / 2 - angleRad; lengthTheta = angleRad; } 
                else { startTheta = Math.PI / 2; lengthTheta = -angleRad; }
            } else {
                if (angleRad >= 0) { startTheta = 3 * Math.PI / 2 - angleRad; lengthTheta = angleRad; } 
                else { startTheta = 3 * Math.PI / 2; lengthTheta = -angleRad; }
            }
            if (lengthTheta < 0.01) lengthTheta = 0.01; 

            const geometry = new THREE.RingGeometry(1.5, 6, 64, 1, startTheta, lengthTheta);
            const mesh = new THREE.Mesh(geometry, new THREE.MeshLambertMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.5, side: THREE.DoubleSide, depthWrite: false }));
            mesh.rotation.x = -Math.PI / 2; mesh.position.copy(center); mesh.position.y = 0.04;
            mesh.receiveShadow = true;
            return mesh;
        };

        const createGroundTextBadge = (pointA, pointB, length, angle, lat, t) => {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)'; ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.lineWidth = 4;
            const r = 24; ctx.beginPath(); ctx.moveTo(r, 0); ctx.lineTo(512 - r, 0); ctx.quadraticCurveTo(512, 0, 512, r); ctx.lineTo(512, 128 - r); ctx.quadraticCurveTo(512, 128, 512 - r, 128); ctx.lineTo(r, 128); ctx.quadraticCurveTo(0, 128, 0, 128 - r); ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
            
            ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 36px sans-serif';
            const refDirection = lat >= 0 ? t('north') : t('south');
            ctx.fillText(`${length.toFixed(2)}m  |  ${angle.toFixed(1)}° (${refDirection})`, 256, 64);
            
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 1.1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, opacity: 0.95, depthWrite: false }));
            mesh.rotation.x = -Math.PI / 2;
            
            const dir = new THREE.Vector3().subVectors(pointB, pointA).normalize();
            const midpoint = new THREE.Vector3().addVectors(pointA, pointB).multiplyScalar(0.5);
            const perp = new THREE.Vector3(-dir.z, 0, dir.x).multiplyScalar(1.5);
            mesh.position.copy(midpoint).add(perp); mesh.position.y = 0.06; 
            
            let textRotation = Math.atan2(dir.x, dir.z) + Math.PI / 2;
            if (textRotation > Math.PI / 2 || textRotation < -Math.PI / 2) textRotation += Math.PI;
            mesh.rotation.z = textRotation;
            return mesh;
        };

                            const measuredAngle = getMeasuredAngle(startPt, measureEnd, latitude);
                            const textBadge = createGroundTextBadge(startPt, measureEnd, dist, measuredAngle, latitude, t); 
                            textBadge.name = 'measureTextBadge'; sceneRef.current.add(textBadge);
                        }
                    }
                }
            }, [time, day, latitude, sundialType, mode, showMeasureTool, measureStart, measureEnd, dots, showTrace, traceStartTime]);

            return (
                <div className="w-full h-full relative flex">
                    <div className="absolute inset-0 z-0" ref={mountRef}></div>
                    <div className="absolute top-0 left-0 w-full p-4 z-10 flex justify-between items-start pointer-events-none">
                        <div className="flex gap-2 pointer-events-auto">
                            <button onClick={onBack} className="bg-slate-900/80 hover:bg-slate-800 text-white px-4 py-2 rounded-lg backdrop-blur-sm border border-slate-700 transition-colors shadow-lg text-sm font-semibold">← {t('back')}</button>
                            <button onClick={onShowInstructions} className="bg-slate-900/80 hover:bg-slate-800 text-white p-2 rounded-lg backdrop-blur-sm border border-slate-700 transition-colors shadow-lg"><Info className="w-5 h-5" /></button>
                        </div>
                        <div className="pointer-events-auto flex items-center gap-3">
                            <div className="hidden md:flex bg-slate-900/70 text-white/90 px-4 py-2 rounded-full text-xs backdrop-blur-sm items-center gap-2 shadow-lg border border-slate-700/50"><Navigation className="w-3.5 h-3.5 text-sky-400" />{t('drag_hint')}</div>
                            <div className="bg-slate-900/80 backdrop-blur-sm border border-slate-700 p-1.5 rounded-lg flex gap-1 shadow-lg text-xs font-bold">
                                {['en', 'fr', 'es'].map(l => (
                                    <button key={l} onClick={() => setLang(l)} className={`px-2 py-1 rounded transition-colors ${lang === l ? 'bg-amber-500 text-slate-950' : 'text-slate-300 hover:text-white'}`}>{l.toUpperCase()}</button>
                                ))}
                            </div>
                        </div>
                    </div>
                    {mode === 'elementary' ? (
                        <ElementaryUI time={time} setTime={setTime} day={day} setDay={setDay} t={t} solarData={solarData} />
                    ) : (
                        <MiddleSchoolUI time={time} setTime={setTime} day={day} setDay={setDay} latitude={latitude} setLatitude={setLatitude} sundialType={sundialType} setSundialType={setSundialType} showMeasureTool={showMeasureTool} setShowMeasureTool={setShowMeasureTool} showDotMarker={showDotMarker} setShowDotMarker={setShowDotMarker} showTrace={showTrace} setShowTrace={setShowTrace} setTraceStartTime={setTraceStartTime} dots={dots} setDots={setDots} t={t} solarData={solarData} measureStart={measureStart} measureEnd={measureEnd} />
                    )}
                    {showModal && (
                        <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <div className="max-w-md w-full bg-slate-900 border border-slate-700 p-6 rounded-3xl shadow-2xl space-y-4 pointer-events-auto">
                                <h3 className="text-2xl font-bold text-white text-center flex items-center justify-center gap-2"><Info className="w-6 h-6 text-amber-400" />{mode === 'elementary' ? t('elem_instr_title') : t('mid_instr_title')}</h3>
                                <ul className="space-y-3 text-slate-300 text-sm">
                                    {[1, 2, 3, 4].map(n => (
                                        <li key={n} className="flex gap-2"><span className="text-amber-400 font-bold">{n}.</span><span>{mode === 'elementary' ? t(`elem_instr_${n}`) : t(`mid_instr_${n}`)}</span></li>
                                    ))}
                                </ul>
                                <button onClick={() => setShowModal(false)} className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl transition-all shadow-md active:scale-95">OK</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function ElementaryUI({ time, setTime, day, setDay, t, solarData }) {
            const [useAmPm, setUseAmPm] = useState(true);
            const isNight = solarData.altitude <= 0;
            
            let sunHeightText = '';
            if (solarData.altitude <= 0) sunHeightText = t('below_horizon');
            else if (solarData.altitude <= 15) sunHeightText = t('very_low');
            else if (solarData.altitude <= 35) sunHeightText = t('low');
            else if (solarData.altitude <= 55) sunHeightText = t('medium');
            else if (solarData.altitude <= 75) sunHeightText = t('high');
            else sunHeightText = t('very_high');
            
            return (
                <>
                    <div className="absolute right-4 top-24 md:top-20 flex flex-col gap-4 z-10 pointer-events-auto">
                        <button onClick={() => window.dispatchEvent(new CustomEvent('setCamera', {detail:{view:'sky'}}))} className="bg-white/95 hover:bg-white text-slate-800 p-3 sm:p-4 rounded-2xl shadow-xl flex flex-col items-center gap-2 border border-slate-200 transition-transform hover:scale-105">
                            <Globe className="w-8 h-8 sm:w-10 sm:h-10 text-sky-500" />
                            <span className="text-[10px] sm:text-xs font-bold uppercase">{t('view_sky')}</span>
                        </button>
                        <button onClick={() => window.dispatchEvent(new CustomEvent('setCamera', {detail:{view:'stick'}}))} className="bg-white/95 hover:bg-white text-slate-800 p-3 sm:p-4 rounded-2xl shadow-xl flex flex-col items-center gap-2 border border-slate-200 transition-transform hover:scale-105">
                            <CompassIcon className="w-8 h-8 sm:w-10 sm:h-10 text-amber-500" />
                            <span className="text-[10px] sm:text-xs font-bold uppercase">{t('view_stick')}</span>
                        </button>
                    </div>

                    <div className="absolute bottom-4 left-1/2 -translate-x-1/2 z-10 w-[98%] max-w-5xl pointer-events-auto">
                        <div className="bg-white/95 border border-white p-3 sm:p-4 rounded-[2rem] shadow-2xl backdrop-blur-md flex flex-col md:flex-row gap-4 lg:gap-6 text-slate-800 items-stretch">
                            
                            <div className="flex flex-row md:flex-col items-center justify-between md:justify-center gap-2 md:w-1/4 border-b md:border-b-0 md:border-r border-slate-200 pb-3 md:pb-0 md:pr-4">
                                <div className="flex items-center gap-3">
                                    <div className="w-12 h-12 bg-slate-100 rounded-2xl flex items-center justify-center border border-slate-200 shadow-sm">{isNight ? <Moon className="text-slate-500 w-6 h-6" /> : <Sun className="w-6 h-6 text-amber-500 animate-[spin_10s_linear_infinite]" />}</div>
                                    <div><div className="text-[10px] uppercase tracking-wider text-slate-400 font-bold">{t('sun_height')}</div><div className="text-lg font-extrabold text-amber-600 leading-none">{sunHeightText}</div></div>
                                </div>
                                <div className="flex items-center gap-2 bg-slate-50 border border-slate-100 p-1.5 px-3 rounded-xl shadow-inner mt-0 md:mt-2">
                                    <span className="font-mono text-lg lg:text-xl font-black text-slate-700">{useAmPm ? formatTimeAmPm(time) : formatTime24(time)}</span>
                                    <button onClick={() => setUseAmPm(!useAmPm)} className="text-[10px] font-bold text-sky-600 bg-sky-100 hover:bg-sky-200 px-2 py-1 rounded-lg transition-colors">{useAmPm ? '24h' : 'AM/PM'}</button>
                                </div>
                            </div>

                            <div className="flex-1 flex flex-col justify-center gap-3 border-b md:border-b-0 md:border-r border-slate-200 pb-3 md:pb-0 md:pr-4">
                                <div className="grid grid-cols-5 gap-1.5 lg:gap-2">
                                    <button onClick={() => setTime(6)} className={`flex flex-col items-center py-2 px-1 rounded-xl transition-all border shadow-sm ${time >= 5 && time < 8 ? 'bg-sky-100 border-sky-400 text-sky-700' : 'bg-slate-50 border-slate-200 text-slate-500'}`}><Sunrise className="w-6 h-6 mb-1 text-sky-500" /><span className="text-[9px] lg:text-[10px] font-extrabold leading-none">{t('early_morning')}</span></button>
                                    <button onClick={() => setTime(9)} className={`flex flex-col items-center py-2 px-1 rounded-xl transition-all border shadow-sm ${time >= 8 && time < 11 ? 'bg-amber-100 border-amber-400 text-amber-700' : 'bg-slate-50 border-slate-200 text-slate-500'}`}><Sun className="w-6 h-6 mb-1 text-amber-500" /><span className="text-[9px] lg:text-[10px] font-extrabold leading-none">{t('mid_morning')}</span></button>
                                    <button onClick={() => setTime(12)} className={`flex flex-col items-center py-2 px-1 rounded-xl transition-all border shadow-sm ${time >= 11 && time <= 13 ? 'bg-amber-200/50 border-amber-500 text-amber-800 font-black' : 'bg-slate-50 border-slate-200 text-slate-500'}`}><Sun className="w-6 h-6 mb-1 text-amber-600" /><span className="text-[9px] lg:text-[10px] font-extrabold leading-none">{t('noon')}</span></button>
                                    <button onClick={() => setTime(15)} className={`flex flex-col items-center py-2 px-1 rounded-xl transition-all border shadow-sm ${time > 13 && time <= 16 ? 'bg-orange-100 border-orange-400 text-orange-700' : 'bg-slate-50 border-slate-200 text-slate-500'}`}><Sun className="w-6 h-6 mb-1 text-orange-500" /><span className="text-[9px] lg:text-[10px] font-extrabold leading-none">{t('afternoon')}</span></button>
                                    <button onClick={() => setTime(18)} className={`flex flex-col items-center py-2 px-1 rounded-xl transition-all border shadow-sm ${time > 16 && time <= 20 ? 'bg-orange-100 border-orange-500 text-orange-800' : 'bg-slate-50 border-slate-200 text-slate-500'}`}><Sunset className="w-6 h-6 mb-1 text-orange-600" /><span className="text-[9px] lg:text-[10px] font-extrabold leading-none">{t('evening')}</span></button>
                                </div>
                                <div className="flex flex-col px-2">
                                    <input type="range" min="0" max="24" step="0.1" value={time} onChange={(e) => setTime(parseFloat(e.target.value))} className="w-full h-4 bg-slate-200 rounded-full appearance-none cursor-pointer accent-amber-500 shadow-inner" />
                                    <div className="flex justify-between px-1 mt-1.5 text-[9px] lg:text-[10px] font-bold text-slate-400 pointer-events-none">
                                        <span>00</span><span>03</span><span>06</span><span>09</span><span>12</span><span>15</span><span>18</span><span>21</span><span>24</span>
                                    </div>
                                </div>
                            </div>

                            <div className="flex flex-col justify-center md:w-1/4 lg:w-1/5">
                                <div className="text-[10px] uppercase tracking-wider text-slate-400 font-bold flex items-center justify-center gap-1 mb-2"><Calendar className="w-3.5 h-3.5 text-amber-500" /> {t('seasons')}</div>
                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => setDay(80)} className={`py-2 px-1 rounded-xl text-xs lg:text-sm font-extrabold transition-all border shadow-sm ${day === 80 ? 'bg-emerald-100 border-emerald-400 text-emerald-800 scale-105' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>🌱 {t('spring')}</button>
                                    <button onClick={() => setDay(172)} className={`py-2 px-1 rounded-xl text-xs lg:text-sm font-extrabold transition-all border shadow-sm ${day === 172 ? 'bg-amber-100 border-amber-400 text-amber-800 scale-105' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>☀️ {t('summer')}</button>
                                    <button onClick={() => setDay(264)} className={`py-2 px-1 rounded-xl text-xs lg:text-sm font-extrabold transition-all border shadow-sm ${day === 264 ? 'bg-orange-100 border-orange-400 text-orange-800 scale-105' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>🍁 {t('autumn')}</button>
                                    <button onClick={() => setDay(355)} className={`py-2 px-1 rounded-xl text-xs lg:text-sm font-extrabold transition-all border shadow-sm ${day === 355 ? 'bg-sky-100 border-sky-400 text-sky-800 scale-105' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>❄️ {t('winter')}</button>
                                </div>
                            </div>

                        </div>
                    </div>
                </>
            );
        }

        function MiddleSchoolUI({ time, setTime, day, setDay, latitude, setLatitude, sundialType, setSundialType, showMeasureTool, setShowMeasureTool, showDotMarker, setShowDotMarker, showTrace, setShowTrace, setTraceStartTime, dots, setDots, t, solarData, measureStart, measureEnd }) {
            const getMonth = (d) => new Date(2023, 0, d).toLocaleString('default', { month: 'short', day: 'numeric' });
            
            const activeHeight = sundialType === 'stick' ? 1.0 : (sundialType === 'horizontal' ? 3.5 : 4.5);
            const rawShadowLen = solarData.altitude > 0 ? (activeHeight / Math.tan(solarData.altitude * (Math.PI / 180))) : 0;
            const calculatedShadowVal = (solarData.altitude > 0 && isFinite(rawShadowLen)) ? rawShadowLen.toFixed(2) + "m" : '∞';
            const rawShadowAngle = (solarData.azimuth + 180) % 360;
            const targetUserAngle = latitude >= 0 ? rawShadowAngle : (rawShadowAngle + 180) % 360;

            const startPt = measureStart || (measureEnd ? new THREE.Vector3(0, measureEnd.y, 0) : null);
            const measuredDist = startPt && measureEnd ? startPt.distanceTo(measureEnd) : 0;
            const measuredAng = startPt && measureEnd ? getMeasuredAngle(startPt, measureEnd, latitude) : 0;

            const isAngleMatched = solarData.altitude > 0 && (Math.abs(measuredAng - targetUserAngle) < 4 || Math.abs(measuredAng - targetUserAngle) > 356);
            const isLengthMatched = solarData.altitude > 0 && Math.abs(measuredDist - rawShadowLen) < 0.25;
            const showMatchBadge = showMeasureTool && startPt && measureEnd && isAngleMatched && isLengthMatched;

            const handleToggleMeasure = () => {
                setShowMeasureTool(!showMeasureTool);
                setShowDotMarker(false);
            };

            const handleToggleDotMarker = () => {
                setShowDotMarker(!showDotMarker);
                setShowMeasureTool(false);
            };

            const handleToggleTrace = () => {
                if (!showTrace) {
                    setTraceStartTime(time); 
                }
                setShowTrace(!showTrace);
            };

            return (
                <>
                    <div className="absolute bottom-6 left-1/2 -translate-x-1/2 flex gap-4 z-10 pointer-events-auto">
                        <button onClick={() => window.dispatchEvent(new CustomEvent('setCamera', {detail:{view:'sky'}}))} className="bg-slate-900/80 hover:bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-xl flex items-center gap-3 border border-slate-700 transition-transform hover:scale-105 backdrop-blur-md">
                            <Globe className="w-5 h-5 text-sky-400" />
                            <span className="text-xs font-bold uppercase tracking-wider">{t('view_sky')}</span>
                        </button>
                        <button onClick={() => window.dispatchEvent(new CustomEvent('setCamera', {detail:{view:'stick'}}))} className="bg-slate-900/80 hover:bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-xl flex items-center gap-3 border border-slate-700 transition-transform hover:scale-105 backdrop-blur-md">
                            <CompassIcon className="w-5 h-5 text-amber-400" />
                            <span className="text-xs font-bold uppercase tracking-wider">{t('view_stick')}</span>
                        </button>
                    </div>

                    <div className="absolute top-20 left-6 z-10 w-80 bg-slate-900/85 backdrop-blur-md p-6 rounded-2xl border border-slate-700 shadow-2xl pointer-events-auto flex flex-col gap-6 max-h-[82vh] overflow-y-auto">
                        <div><div className="flex justify-between mb-2"><label className="text-xs font-bold text-sky-300 uppercase tracking-wider flex items-center gap-2"><Clock className="w-4 h-4" /> {t('time_of_day')}</label><span className="font-mono bg-slate-800 px-2 rounded text-xs text-sky-100">{formatTime24(time)}</span></div><input type="range" min="0" max="24" step="0.25" value={time} onChange={(e) => setTime(parseFloat(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-500" /></div>
                        <div><div className="flex justify-between mb-2"><label className="text-xs font-bold text-amber-300 uppercase tracking-wider flex items-center gap-2"><BookOpen className="w-4 h-4" /> {t('day_of_year')}</label><span className="font-mono bg-slate-800 px-2 rounded text-xs text-amber-100">{getMonth(day)}</span></div><input type="range" min="1" max="365" step="1" value={day} onChange={(e) => setDay(parseInt(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-amber-500" /></div>
                        <div><div className="flex justify-between mb-2"><label className="text-xs font-bold text-emerald-300 uppercase tracking-wider flex items-center gap-2"><Globe className="w-4 h-4" /> {t('latitude')}</label><span className="font-mono bg-slate-800 px-2 rounded text-xs text-emerald-100">{latitude}°</span></div><input type="range" min="-90" max="90" step="1" value={latitude} onChange={(e) => setLatitude(parseInt(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500" /><div className="flex justify-between text-[10px] text-slate-500 mt-1 font-bold"><span>90°S</span><span>0°</span><span>90°N</span></div></div>
                        <hr className="border-slate-700" />
                        <div>
                            <label className="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2 mb-3"><Layers className="w-4 h-4" /> {t('sundial_type')}</label>
                            <div className="flex flex-col gap-2">
                                <button onClick={() => setSundialType('stick')} className={`px-3 py-2 text-xs text-left rounded-lg transition-colors font-bold border ${sundialType === 'stick' ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}>{t('stick')}</button>
                                <button onClick={() => setSundialType('horizontal')} className={`px-3 py-2 text-xs text-left rounded-lg transition-colors font-bold border ${sundialType === 'horizontal' ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}>{t('horizontal')}</button>
                                <button onClick={() => setSundialType('equatorial')} className={`px-3 py-2 text-xs text-left rounded-lg transition-colors font-bold border ${sundialType === 'equatorial' ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}>{t('equatorial')}</button>
                            </div>
                        </div>
                        <hr className="border-slate-700" />
                        <div>
                            <label className="text-xs font-bold text-pink-400 uppercase tracking-wider flex items-center gap-2 mb-3"><Ruler className="w-4 h-4" /> {t('measure_tools')}</label>
                            <div className="flex flex-col gap-2">
                                <button onClick={handleToggleMeasure} className={`px-3 py-2 text-xs text-left rounded-lg transition-colors font-bold border flex justify-between items-center ${showMeasureTool ? 'bg-pink-600/20 border-pink-500 text-pink-200' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}><span>{t('measure_tool')}</span><span className={`w-2.5 h-2.5 rounded-full ${showMeasureTool ? 'bg-pink-400 animate-pulse' : 'bg-slate-600'}`}></span></button>
                                <button onClick={handleToggleDotMarker} className={`px-3 py-2 text-xs text-left rounded-lg transition-colors font-bold border flex justify-between items-center ${showDotMarker ? 'bg-amber-600/20 border-amber-500 text-amber-200' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}><span>{t('mark_dots')}</span><span className={`w-2.5 h-2.5 rounded-full ${showDotMarker ? 'bg-amber-400 animate-pulse' : 'bg-slate-600'}`}></span></button>
                                <button onClick={handleToggleTrace} className={`px-3 py-2 text-xs text-left rounded-lg transition-colors font-bold border flex justify-between items-center ${showTrace ? 'bg-orange-600/20 border-orange-500 text-orange-200' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}><span>{t('trace_shadow')}</span><span className={`w-2.5 h-2.5 rounded-full ${showTrace ? 'bg-orange-400 animate-pulse' : 'bg-slate-600'}`}></span></button>
                                {dots.length > 0 && (
                                    <button onClick={() => setDots([])} className="px-3 py-1.5 mt-1 text-xs text-center rounded-lg bg-red-900/40 hover:bg-red-800 text-red-200 border border-red-700 transition-colors">
                                        {t('clear_dots')}
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="absolute top-20 right-6 z-10 w-72 bg-slate-900/85 backdrop-blur-md p-5 rounded-2xl border border-slate-700 shadow-2xl pointer-events-auto flex flex-col gap-5">
                        <div><h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest border-b border-slate-700 pb-2">Live Data & Measures</h3></div>
                        <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-2">
                                <div><div className="text-[10px] text-slate-500 uppercase font-bold">{t('altitude')}</div><div className={`text-2xl font-mono font-bold ${solarData.altitude > 0 ? 'text-amber-400' : 'text-slate-600'}`}>{solarData.altitude > 0 ? solarData.altitude.toFixed(1) : 0}°</div></div>
                                <div><div className="text-[10px] text-slate-500 uppercase font-bold">{t('azimuth')}</div><div className="text-2xl font-mono font-bold text-sky-400">{solarData.azimuth.toFixed(1)}°</div></div>
                            </div>

                            {(showMeasureTool || showDotMarker) && (
                                <div className="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50 space-y-4">
                                    <span className="text-[10px] text-amber-300 font-bold uppercase tracking-wider block leading-tight">
                                        {showDotMarker ? t('mark_hint') : t('measure_hint')}
                                    </span>
                                    
                                    {(!measureStart && !showDotMarker) && (
                                        <div className="text-xs text-slate-300 animate-pulse pt-2 text-center font-bold">CLICK & DRAG to measure!</div>
                                    )}
                                    
                                    {showMatchBadge && (
                                        <div className="bg-emerald-500/20 border border-emerald-500 p-2 rounded-lg flex items-center justify-center gap-2 text-emerald-300 text-xs font-bold animate-bounce"><CheckCircle className="w-4 h-4" /><span>{t('measure_match')}</span></div>
                                    )}
                                </div>
                            )}

                            <div className="pt-2 border-t border-slate-700 space-y-3 opacity-60">
                                <div><div className="text-[10px] text-slate-500 uppercase font-bold">{t('shadow_len')} (Math. Calc)</div><div className={`text-xl font-mono font-bold mt-1 ${solarData.altitude > 0 ? 'text-emerald-400' : 'text-slate-600'}`}>{calculatedShadowVal}</div></div>
                                <div><div className="text-[10px] text-slate-500 uppercase font-bold">{t('shadow_angle')} {latitude >= 0 ? t('from_north') : t('from_south')}</div><div className={`text-xl font-mono font-bold mt-1 ${solarData.altitude > 0 ? 'text-pink-400' : 'text-slate-600'}`}>{solarData.altitude > 0 ? `${targetUserAngle.toFixed(1)}°` : '—'}</div></div>
                            </div>
                        </div>
                    </div>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
