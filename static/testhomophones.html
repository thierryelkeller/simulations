                  questions: [
                    { text: ["Find the error: 'Your going to trip on that wire!'"], options: ["'Your' should be 'You're'", "No error"], answer: "'Your' should be 'You're'" },
                    { text: ["Find the error: 'Is this you're smartphone?'"], options: ["'you're' should be 'your'", "No error"], answer: "'you're' should be 'your'" },
                    { text: ["Find the error: 'I really appreciate you're help.'"], options: ["'you're' should be 'your'", "No error"], answer: "'you're' should be 'your'" },
                    { text: ["Find the error: 'Make sure your on time.'"], options: ["'your' should be 'you're'", "No error"], answer: "'your' should be 'you're'" },
                    { text: ["Find the error: 'Call your father.'"], options: ["No error", "'your' should be 'you're'"], answer: "No error" }
                  ]
                }
              }
            }
          ]
        };

        // --- MAIN APP COMPONENT ---
        function App() {
          const [language, setLanguage] = useState(null); // 'fr' or 'en'
          const [currentView, setCurrentView] = useState('splash'); // 'splash', 'home', 'lesson'
          const [activeLesson, setActiveLesson] = useState(null);
          
          // Progress structure: { 'fr': { 'a-a': { dok1: 100, dok2: 0, dok3: 0 } } }
          const [progress, setProgress] = useState({ fr: {}, en: {} });

          // Load local progress if available
          useEffect(() => {
            const saved = localStorage.getItem('homophones_progress');
            if (saved) {
              try {
                setProgress(JSON.parse(saved));
              } catch (e) {
                console.error("Could not parse saved progress");
              }
            }
          }, []);

          const saveProgress = (newProgress) => {
            setProgress(newProgress);
            localStorage.setItem('homophones_progress', JSON.stringify(newProgress));
          };

          const handleLanguageSelect = (lang) => {
            setLanguage(lang);
            setCurrentView('home');
          };

          const openLesson = (lesson) => {
            setActiveLesson(lesson);
            setCurrentView('lesson');
          };

          const goBack = () => {
            setActiveLesson(null);
            setCurrentView('home');
          };

          const handleUpdateProgress = (lessonId, levelKey, percentage) => {
            const currentLang = language;
            const prevScore = progress[currentLang]?.[lessonId]?.[levelKey] || 0;
            if (percentage > prevScore) {
              const updatedProgress = {
                ...progress,
                [currentLang]: {
                  ...progress[currentLang],
                  [lessonId]: {
                    ...(progress[currentLang]?.[lessonId] || {}),
                    [levelKey]: percentage
                  }
                }
              };
              saveProgress(updatedProgress);
            }
          };

          const getLessonAverage = (lessonId) => {
            const levels = ['dok1', 'dok2', 'dok3'];
            const scores = progress[language]?.[lessonId] || {};
            let total = 0;
            levels.forEach(lvl => {
              total += (scores[lvl] || 0);
            });
            return Math.round(total / levels.length);
          };

          const getAverageProgress = () => {
            if (!language) return 0;
            const lessons = contentData[language];
            if (lessons.length === 0) return 0;
            
            let totalScore = 0;
            lessons.forEach(l => {
              totalScore += getLessonAverage(l.id);
            });
            return Math.round(totalScore / lessons.length);
          };

          if (currentView === 'splash') {
            return (
              <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-8 text-center border border-slate-100 transition-all hover:shadow-emerald-500/10">
                  <div className="flex justify-center mb-6">
                    <div className="w-24 h-24 bg-gradient-to-tr from-emerald-400 to-indigo-500 rounded-2xl flex items-center justify-center shadow-lg transform rotate-3 hover:rotate-12 transition-transform duration-300">
                      <IconGlobe className="w-12 h-12 text-white" />
                    </div>
                  </div>
                  <h1 className="text-4xl font-extrabold text-slate-800 mb-2 tracking-tight">Maître des Homophones</h1>
                  <h2 className="text-xl text-slate-500 mb-8 font-medium">Homophone Master</h2>
                  
                  <div className="space-y-4">
                    <button 
                      onClick={() => handleLanguageSelect('fr')}
                      className="w-full py-4 px-6 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl text-lg font-bold transition-all transform hover:-translate-y-1 shadow-lg flex items-center justify-center gap-3"
                    >
                      <span className="text-2xl">🇫🇷</span> Entrer en Français
                    </button>
                    <button 
                      onClick={() => handleLanguageSelect('en')}
                      className="w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl text-lg font-bold transition-all transform hover:-translate-y-1 shadow-lg flex items-center justify-center gap-3"
                    >
                      <span className="text-2xl">🇬🇧</span> Enter in English
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          const ui = UI[language];
          const lessons = contentData[language];
          const themeColor = language === 'fr' ? 'emerald' : 'indigo';
          const bgTheme = language === 'fr' ? 'bg-emerald-50/40' : 'bg-indigo-50/40';
          const textTheme = language === 'fr' ? 'text-emerald-800' : 'text-indigo-800';

          if (currentView === 'home') {
            return (
              <div className={`min-h-screen ${bgTheme} p-4 md:p-8 font-sans text-slate-800`}>
                <div className="max-w-4xl mx-auto">
                  
                  {/* Dashboard */}
                  <div className="bg-white rounded-3xl shadow-xl p-6 md:p-8 mb-8 flex flex-col md:flex-row items-center justify-between border border-slate-100">
                    <div className="text-center md:text-left mb-6 md:mb-0">
                      <h1 className={`text-4xl font-black ${textTheme} mb-2`}>{ui.appTitle}</h1>
                      <p className="text-slate-500 font-medium text-lg">{ui.subtitle}</p>
                    </div>
                    <div className="flex flex-col items-center bg-slate-50 p-4 rounded-2xl border border-slate-100 min-w-[220px]">
                      <span className="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider">{ui.progressTitle}</span>
                      <div className="relative w-28 h-28">
                        <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                          <circle cx="18" cy="18" r="16" fill="none" stroke="#e2e8f0" strokeWidth="3" />
                          <circle 
                            cx="18" 
                            cy="18" 
                            r="16" 
                            fill="none" 
                            stroke={language === 'fr' ? "#10b981" : "#4f46e5"} 
                            strokeWidth="3" 
                            strokeDasharray={`${getAverageProgress()}, 100`}
                            strokeLinecap="round"
                          />
                        </svg>
                        <div className="absolute inset-0 flex flex-col items-center justify-center">
                          <span className={`text-2xl font-extrabold ${textTheme}`}>{getAverageProgress()}%</span>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Options bar */}
                  <div className="mb-6 flex justify-between items-center bg-white/80 backdrop-blur-md px-6 py-3 rounded-2xl border border-slate-100">
                    <div className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                      <span className="text-xs font-bold text-slate-500 uppercase tracking-wide">Active Track: {language.toUpperCase()}</span>
                    </div>
                    <button 
                      onClick={() => { setLanguage(null); setCurrentView('splash'); }}
                      className="text-sm font-bold text-slate-500 hover:text-slate-900 transition-colors flex items-center gap-1"
                    >
                      <IconGlobe className="w-4 h-4" /> Change Language / Changer de langue
                    </button>
                  </div>

                  {/* Compact organized list of Homophones */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {lessons.map(lesson => {
                      const avgScore = getLessonAverage(lesson.id);
                      const isFinished = avgScore === 100;
                      const scores = progress[language]?.[lesson.id] || {};

                      return (
                        <div 
                          key={lesson.id} 
                          onClick={() => openLesson(lesson)}
                          className="bg-white rounded-2xl shadow-sm hover:shadow-lg border border-slate-100 transition-all duration-300 cursor-pointer p-6 flex items-center justify-between group relative overflow-hidden"
                        >
                          <div className={`absolute top-0 left-0 bottom-0 w-1.5 ${isFinished ? 'bg-emerald-500' : 'bg-slate-200'}`}></div>
                          
                          <div className="flex items-center gap-4 pl-2">
                            <div className="w-14 h-14 bg-slate-50 rounded-2xl flex items-center justify-center text-3xl group-hover:scale-110 transition-transform">
                              {lesson.icon}
                            </div>
                            <div>
                              <h3 className="text-xl font-bold text-slate-800">{lesson.title}</h3>
                              <div className="flex gap-1.5 mt-1.5">
                                {['dok1', 'dok2', 'dok3'].map((lvl, index) => {
                                  const lvlScore = scores[lvl] || 0;
                                  return (
                                    <span 
                                      key={lvl} 
                                      className={`text-[10px] font-extrabold px-2 py-0.5 rounded-full ${
                                        lvlScore === 100 ? 'bg-emerald-100 text-emerald-700' : 
                                        lvlScore > 0 ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-400'
                                      }`}
                                    >
                                      L{index+1}
                                    </span>
                                  );
                                })}
                              </div>
                            </div>
                          </div>

                          <div className="flex items-center gap-3">
                            <div className="text-right">
                              <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">{ui.scoreText}</div>
                              <div className={`text-lg font-black ${avgScore > 0 ? textTheme : 'text-slate-300'}`}>{avgScore}%</div>
                            </div>
                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center transition-colors ${
                              isFinished ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-400'
                            }`}>
                              <IconArrowRight className="w-5 h-5 group-hover:translate-x-1 transition-transform" />
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                </div>
              </div>
            );
          }

          // --- LESSON VIEW ---
          return (
            <LessonView 
              lesson={activeLesson} 
              ui={ui} 
              goBack={goBack} 
              themeColor={themeColor}
              onUpdateProgress={handleUpdateProgress}
              lessonProgress={progress[language]?.[activeLesson.id] || {}}
            />
          );
        }

        // --- SUB-COMPONENT FOR INTERACTIVE LESSONS (GUI COMPACT & TAB-BASED) ---
        function LessonView({ lesson, ui, goBack, themeColor, onUpdateProgress, lessonProgress }) {
          const [activeTab, setActiveTab] = useState('theory'); // 'theory', 'dok1', 'dok2', 'dok3'
          const [selectedAnswers, setSelectedAnswers] = useState({}); // { qIndex: selected_option }
          const [checkedLevels, setCheckedLevels] = useState({}); // { levelKey: boolean }
          const [levelScores, setLevelScores] = useState({}); // { levelKey: score_percentage }

          // Reset user choices when tab or lesson changes
          useEffect(() => {
            setSelectedAnswers({});
          }, [activeTab, lesson]);

          const handleAnswerSelect = (qIndex, option) => {
            if (checkedLevels[activeTab]) return; // locked once checked
            setSelectedAnswers(prev => ({
              ...prev,
              [qIndex]: option
            }));
          };

          const checkLevelAnswers = () => {
            const currentLevel = lesson.levels[activeTab];
            if (!currentLevel) return;

            let correctCount = 0;
            currentLevel.questions.forEach((q, idx) => {
              if (selectedAnswers[idx] === q.answer) {
                correctCount++;
              }
            });

            const percentage = Math.round((correctCount / currentLevel.questions.length) * 100);
            setLevelScores(prev => ({ ...prev, [activeTab]: percentage }));
            setCheckedLevels(prev => ({ ...prev, [activeTab]: true }));
            onUpdateProgress(lesson.id, activeTab, percentage);
          };

          const isLevelComplete = () => {
            const currentLevel = lesson.levels[activeTab];
            if (!currentLevel) return false;
            return currentLevel.questions.every((_, idx) => selectedAnswers[idx] !== undefined);
          };

          const getStatusColor = (lvlKey) => {
            const score = lessonProgress[lvlKey] || levelScores[lvlKey] || 0;
            if (score === 100) return 'bg-emerald-500 text-white';
            if (score > 0) return 'bg-amber-400 text-white';
            return 'bg-slate-100 text-slate-400';
          };

          const themeClasses = {
            text: themeColor === 'emerald' ? 'text-emerald-700' : 'text-indigo-700',
            bg: themeColor === 'emerald' ? 'bg-emerald-600' : 'bg-indigo-600',
            bgHover: themeColor === 'emerald' ? 'hover:bg-emerald-700' : 'hover:bg-indigo-700',
            lightBg: themeColor === 'emerald' ? 'bg-emerald-50/50' : 'bg-indigo-50/50',
            border: themeColor === 'emerald' ? 'border-emerald-200' : 'border-indigo-200',
            activeTab: themeColor === 'emerald' ? 'border-emerald-500 text-emerald-600' : 'border-indigo-500 text-indigo-600'
          };

          return (
            <div className={`min-h-screen ${themeClasses.lightBg} p-4 md:p-8 font-sans`}>
              <div className="max-w-5xl mx-auto">
                
                {/* Top Nav */}
                <button 
                  onClick={goBack}
                  className="flex items-center text-slate-500 hover:text-slate-800 font-bold mb-6 transition-colors"
                >
                  <IconChevronLeft className="w-5 h-5 mr-1" /> {ui.backBtn}
                </button>

                {/* Lesson Header Card */}
                <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 mb-8 flex items-center gap-4">
                  <span className="text-5xl">{lesson.icon}</span>
                  <div>
                    <h1 className={`text-3xl font-black ${themeClasses.text}`}>{lesson.title}</h1>
                    <p className="text-slate-400 text-sm font-semibold uppercase tracking-wider mt-1">Interactive Lesson Hub</p>
                  </div>
                </div>

                {/* Sidebar + Tabbed Layout */}
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                  
                  {/* Lesson Navigation (Left Sidebar) */}
                  <div className="lg:col-span-4 bg-white rounded-3xl p-6 shadow-sm border border-slate-100 space-y-2">
                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest px-2 mb-4">Steps & Levels</h3>
                    
                    <button 
                      onClick={() => { setActiveTab('theory'); }}
                      className={`w-full flex items-center justify-between p-3.5 rounded-2xl font-bold transition-all text-left ${
                        activeTab === 'theory' ? 'bg-slate-100 text-slate-800 scale-102' : 'text-slate-500 hover:bg-slate-50'
                      }`}
                    >
                      <span className="flex items-center gap-2.5">
                        <IconBookOpen className="w-5 h-5 text-slate-400" />
                        <span>📖 Leçon & Astuces</span>
                      </span>
                    </button>

                    {Object.keys(lesson.levels).map((lvlKey, idx) => {
                      const levelObj = lesson.levels[lvlKey];
                      const active = activeTab === lvlKey;
                      const score = lessonProgress[lvlKey] || levelScores[lvlKey] || 0;

                      return (
                        <button 
                          key={lvlKey}
                          onClick={() => { setActiveTab(lvlKey); }}
                          className={`w-full flex items-center justify-between p-3.5 rounded-2xl font-bold transition-all text-left ${
                            active ? 'bg-slate-100 text-slate-800 scale-102' : 'text-slate-500 hover:bg-slate-50'
                          }`}
                        >
                          <span className="flex items-center gap-2.5">
                            <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-black ${getStatusColor(lvlKey)}`}>
                              {idx + 1}
                            </span>
                            <span>{levelObj.title}</span>
                          </span>
                          {score > 0 && <span className="text-xs font-black text-slate-400">{score}%</span>}
                        </button>
                      );
                    })}
                  </div>

                  {/* Active Content Pane (Right Area) */}
                  <div className="lg:col-span-8 bg-white rounded-3xl shadow-sm border border-slate-100 p-6 md:p-8 min-h-[480px] flex flex-col justify-between">
                    
                    {activeTab === 'theory' ? (
                      // THEORY TAB
                      <div className="animate-fadeIn">
                        <div className="flex items-center gap-3 border-b border-slate-100 pb-4 mb-6">
                          <IconBookOpen className={`w-6 h-6 ${themeClasses.text}`} />
                          <h2 className="text-xl font-bold text-slate-800">{ui.rulesTitle}</h2>
                        </div>

                        <div className="space-y-6">
                          {lesson.rules.map((rule, idx) => (
                            <div key={idx} className={`p-5 rounded-2xl border-l-4 ${themeClasses.border} bg-slate-50/50`}>
                              <div className="flex items-baseline gap-2 mb-2">
                                <span className={`text-xl font-black ${themeClasses.text}`}>{rule.word}</span>
                                <span className="text-slate-600 font-medium">{rule.desc}</span>
                              </div>
                              <div className="text-xs font-bold text-slate-500 bg-white inline-block px-3 py-1.5 rounded-xl shadow-sm border border-slate-100 mt-2">
                                💡 {rule.tip}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    ) : (
                      // EXERCISE LEVEL TABS
                      <div className="animate-fadeIn flex flex-col justify-between h-full">
                        <div>
                          <div className="flex items-center justify-between border-b border-slate-100 pb-4 mb-6">
                            <div className="flex items-center gap-3">
                              <IconStar className={`w-6 h-6 ${themeClasses.text}`} />
                              <h2 className="text-xl font-bold text-slate-800">{lesson.levels[activeTab].title}</h2>
                            </div>
                            <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">{lesson.levels[activeTab].questions.length} Questions</span>
                          </div>

                          <p className="text-sm text-slate-500 mb-6 font-medium">{lesson.levels[activeTab].instructions}</p>

                          <div className="space-y-6">
                            {lesson.levels[activeTab].questions.map((question, qIndex) => {
                              const isChecked = checkedLevels[activeTab];
                              const userAnswer = selectedAnswers[qIndex];
                              const isCorrect = userAnswer === question.answer;

                              return (
                                <div key={qIndex} className="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                                  {/* Question Text */}
                                  <div className="text-base font-semibold text-slate-700 leading-relaxed mb-3">
                                    {question.text.map((part, pIndex) => (
                                      <span key={pIndex}>
                                        {part}
                                        {pIndex < question.text.length - 1 && (
                                          <span className={`mx-2 inline-block border-b-2 font-bold px-2 py-0.5 min-w-[70px] text-center ${
                                            isChecked 
                                              ? (isCorrect ? 'text-emerald-600 border-emerald-500 bg-emerald-50' : 'text-rose-600 border-rose-500 bg-rose-50 line-through') 
                                              : (userAnswer ? 'border-slate-800 text-slate-800' : 'border-slate-300 text-slate-300')
                                          }`}>
                                            {userAnswer || '____'}
                                          </span>
                                        )}
                                      </span>
                                    ))}

                                    {/* Feedback Correction label */}
                                    {isChecked && !isCorrect && (
                                      <span className="ml-2 inline-block text-xs font-bold text-emerald-600 bg-emerald-100 px-2 py-1 rounded-lg">
                                        👉 {question.answer}
                                      </span>
                                    )}
                                  </div>

                                  {/* Answer Options */}
                                  <div className="flex flex-wrap gap-2 mt-3">
                                    {question.options.map((option, oIdx) => {
                                      const isSelected = userAnswer === option;
                                      return (
                                        <button
                                          key={oIdx}
                                          disabled={isChecked}
                                          onClick={() => handleAnswerSelect(qIndex, option)}
                                          className={`px-4 py-2 rounded-xl text-sm font-bold transition-all ${
                                            isSelected 
                                              ? `${themeClasses.bg} text-white shadow-md shadow-slate-200` 
                                              : 'bg-white text-slate-600 border border-slate-200 hover:border-slate-300'
                                          } ${isChecked ? 'opacity-60 cursor-not-allowed' : ''}`}
                                        >
                                          {option}
                                        </button>
                                      );
                                    })}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>

                        {/* Checking Button / Result Output */}
                        <div className="mt-8 pt-6 border-t border-slate-100 flex flex-col items-center">
                          {!checkedLevels[activeTab] ? (
                            <button
                              onClick={checkLevelAnswers}
                              disabled={!isLevelComplete()}
                              className={`py-3.5 px-8 rounded-2xl text-white font-extrabold text-base transition-all transform ${
                                isLevelComplete() 
                                  ? `${themeClasses.bg} ${themeClasses.bgHover} hover:-translate-y-0.5 shadow-lg` 
                                  : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                              }`}
                            >
                              {ui.checkBtn}
                            </button>
                          ) : (
                            <div className="text-center w-full">
                              <div className="flex items-center justify-center gap-2 mb-2">
                                <IconTrophy className={`w-8 h-8 ${themeColor === 'emerald' ? 'text-emerald-500' : 'text-indigo-500'}`} />
                                <span className="text-2xl font-black text-slate-800">
                                  {ui.scoreText} {levelScores[activeTab]}%
                                </span>
                              </div>
                              <p className="text-slate-500 text-sm font-medium mb-4">
                                {levelScores[activeTab] === 100 ? ui.perfect : ui.keepGoing}
                              </p>
                              <button
                                onClick={() => {
                                  // Reset level to try again
                                  setCheckedLevels(prev => ({ ...prev, [activeTab]: false }));
                                  setSelectedAnswers({});
                                }}
                                className="text-sm font-bold text-slate-500 hover:text-slate-800 underline"
                              >
                                Réessayer / Try again
                              </button>
                            </div>
                          )}
                        </div>

                      </div>
                    )}

                  </div>

                </div>

              </div>
            </div>
          );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
