          useEffect(() => {

          const saveProgress = (newProgress) => {
            setProgress(newProgress);
            localStorage.setItem('homophones_v2_progress', JSON.stringify(newProgress));
          };

          const handleUpdateProgress = (lessonId, levelKey, percentage) => {
            const currentLang = language;
            const prevScore = progress[currentLang]?.[lessonId]?.[levelKey] || 0;
            if (percentage > prevScore) {
              const updated = {
                ...progress,
                [currentLang]: {
                  ...progress[currentLang],
                  [lessonId]: { ...(progress[currentLang]?.[lessonId] || {}), [levelKey]: percentage }
                }
              };
              saveProgress(updated);
            }

          const getLessonAverage = (lessonId) => {
            const levels = ['dok1', 'dok2', 'dok3'];
            const scores = progress[language]?.[lessonId] || {};
            let total = 0;
            levels.forEach(lvl => { total += (scores[lvl] || 0); });
            return Math.round(total / levels.length);
          };

            if (!language) return 0;
            const lessons = contentData[language];
            if (lessons.length === 0) return 0;

              </div>
            );

          const lessons = contentData[language];
          const isFr = language === 'fr';
          const themeColor = isFr ? 'emerald' : 'indigo';

          // Component: Tabbed Lesson View
          if (currentView === 'lesson') {
            return (
              <div className="flex h-screen bg-slate-50">

        function InteractiveLesson({ lesson, ui, themeColor, onUpdateProgress, lessonScores, onMobileBack }) {
          const [activeTab, setActiveTab] = useState('theory');
          const [selectedAnswers, setSelectedAnswers] = useState({});
          const [isChecked, setIsChecked] = useState(false);
          const [score, setScore] = useState(0);

          // Reset when tab or lesson changes
          useEffect(() => {
            setSelectedAnswers({});
            setIsChecked(false);
            setScore(0);
          }, [activeTab, lesson.id]);

          const currentContent = activeTab === 'theory' ? null : lesson.levels[activeTab];
          const isComplete = currentContent && currentContent.questions.every((_, i) => selectedAnswers[i] !== undefined);

          const handleCheck = () => {
            let correct = 0;
            currentContent.questions.forEach((q, i) => {
              if (selectedAnswers[i] === q.answer) correct++;
            });
            const pct = Math.round((correct / currentContent.questions.length) * 100);
            setScore(pct);
            setIsChecked(true);
            onUpdateProgress(lesson.id, activeTab, pct);
          };

          const textCol = themeColor === 'emerald' ? 'text-emerald-700' : 'text-indigo-700';
          const bgCol = themeColor === 'emerald' ? 'bg-emerald-600' : 'bg-indigo-600';
          const activeTabClass = themeColor === 'emerald' ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : 'bg-indigo-100 text-indigo-800 border-indigo-300';

                  ) : (
                    <div className="space-y-8 fade-in">
                      <div className="mb-6">
                        <h2 className="text-2xl font-black text-slate-800 mb-2">{currentContent.title}</h2>
                        <p className="text-slate-500 font-medium">{currentContent.desc}</p>
                      </div>

                      {currentContent.questions.map((q, idx) => {
                        const ans = selectedAnswers[idx];
                        const isRight = ans === q.answer;
                        return (
                          <div key={idx} className={`p-6 rounded-3xl bg-white border ${isChecked ? (isRight ? 'border-emerald-200' : 'border-rose-200') : 'border-slate-200'} shadow-sm transition-colors`}>
                            <div className="text-lg font-bold text-slate-700 mb-4 leading-relaxed flex flex-wrap items-center">
                              {q.text.map((part, pIdx) => (
                                <React.Fragment key={pIdx}>
                                  <span>{part}</span>
                                  {pIdx < q.text.length - 1 && (
                                    <span className={`mx-2 px-3 py-1 min-w-[80px] text-center border-b-4 font-black rounded-t-lg transition-colors ${
                                      isChecked ? (isRight ? 'text-emerald-600 border-emerald-500 bg-emerald-50' : 'text-rose-600 border-rose-500 bg-rose-50 line-through') 
                                      : (ans ? `${textCol} border-slate-800 bg-slate-50` : 'text-slate-300 border-slate-300')
                                    }`}>
                                      {ans || '____'}
                                    </span>
                                  )}
                                </React.Fragment>
                              ))}
                              {isChecked && !isRight && (
                                <span className="ml-3 px-3 py-1 bg-emerald-100 text-emerald-700 font-black rounded-lg text-sm border border-emerald-200 fade-in">
                                  👉 {q.answer}
                                </span>
                              )}
                            </div>

                            {!isChecked && (
                              <div className="flex flex-wrap gap-3 mt-4">
                                {q.options.map((opt, oIdx) => (
                                  <button
                                    key={oIdx}
                                    onClick={() => setSelectedAnswers(p => ({...p, [idx]: opt}))}
                                    className={`px-5 py-2.5 rounded-xl font-bold transition-all border-2 active:scale-95 ${ans === opt ? `${bgCol} text-white border-transparent shadow-md` : 'bg-white text-slate-600 border-slate-200 hover:border-slate-300 hover:bg-slate-50'}`}
                                  >
                                    {opt}
                                  </button>
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      })}

                      {/* Controls Bottom */}
                      <div className="pt-8 pb-10 flex flex-col items-center border-t border-slate-200">
                        {!isChecked ? (
                          <button
                            onClick={handleCheck}
                            disabled={!isComplete}
                            className={`py-4 px-10 rounded-2xl font-black text-lg transition-all transform ${isComplete ? `${bgCol} text-white shadow-xl hover:-translate-y-1` : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                          >
                            {ui.checkBtn}
                          </button>
                        ) : (
                          <div className="text-center fade-in bg-white p-8 rounded-3xl border border-slate-100 shadow-xl w-full max-w-md">
                            <div className={`text-5xl font-black mb-4 ${score === 100 ? 'text-emerald-500' : textCol}`}>
                              {score}%
                            </div>
                            <p className="text-slate-600 font-bold text-lg mb-6">
                              {score === 100 ? ui.perfect : ui.keepGoing}
                            </p>
                            <button
                              onClick={() => { setIsChecked(false); setSelectedAnswers({}); }}
                              className="py-3 px-8 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold shadow-md transition-transform active:scale-95"
                            >
                              {ui.retryBtn}
                            </button>
                          </div>
                        )}
                      </div>

                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
