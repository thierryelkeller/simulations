            33% { transform: translate(30px, -50px) scale(1.1); }

        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        // --- MAIN APP ---
        function App() {
          const [language, setLanguage] = useState(null);
          const [activeLesson, setActiveLesson] = useState(null);
          const [progress, setProgress] = useState({ fr: {}, en: {} });
          const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

          useEffect(() => {
            const saved = localStorage.getItem('homophones_v3');
            if (saved) { try { setProgress(JSON.parse(saved)); } catch (e) {} }
          }, []);

          const saveProgress = (newP) => {
            setProgress(newP);
            localStorage.setItem('homophones_v3', JSON.stringify(newP));
          };

          const handleUpdateProgress = (lessonId, levelKey, pct) => {
            const p = progress[language]?.[lessonId]?.[levelKey] || 0;
            if (pct > p) {
              saveProgress({
                ...progress,
                [language]: {
                  ...progress[language],
                  [lessonId]: { ...(progress[language]?.[lessonId] || {}), [levelKey]: pct }
                }
              });
            }
          };

          const getLessonScore = (id) => {
            const sc = progress[language]?.[id] || {};
            return Math.round(((sc.dok1||0) + (sc.dok2||0) + (sc.dok3||0)) / 3);
          };

          const getTotalScore = () => {
            if(!language) return 0;
            const ls = contentData[language];
            let t = 0; ls.forEach(l => t += getLessonScore(l.id));
            return Math.round(t / ls.length);
          };

          if (!language) {
            return (
              <div className="min-h-screen bg-slate-900 flex items-center justify-center p-6 relative overflow-hidden">

                </div>
              </div>
            );

          const lessons = contentData[language];

              {isMobileMenuOpen && <div className="fixed inset-0 bg-slate-900/50 z-30 md:hidden fade-in" onClick={() => setIsMobileMenuOpen(false)}></div>}
            </div>
          );
        }

        // --- LESSON COMPONENT (Compact Tabs & Rows) ---
        function InteractiveLesson({ lesson, ui, themeColor, onUpdateProgress, lessonScores }) {
          const [activeTab, setActiveTab] = useState('theory');
          const [answers, setAnswers] = useState({});
          const [checked, setChecked] = useState(false);
          const [score, setScore] = useState(0);

          useEffect(() => {
            setAnswers({}); setChecked(false); setScore(0); setActiveTab('theory');
          }, [lesson?.id]);

          if (!lesson) return null;

          const currentContent = activeTab === 'theory' ? null : lesson.levels[activeTab];
          const isComplete = currentContent && currentContent.questions.every((_, i) => answers[i] !== undefined);

          const handleCheck = () => {
            let correct = 0;
            currentContent.questions.forEach((q, i) => { if (answers[i] === q.answer) correct++; });
            const pct = Math.round((correct / currentContent.questions.length) * 100);
            setScore(pct); setChecked(true); onUpdateProgress(lesson.id, activeTab, pct);
          };

          const tc = themeColor === 'emerald' ? 'text-emerald-700' : 'text-indigo-700';
          const bgc = themeColor === 'emerald' ? 'bg-emerald-600' : 'bg-indigo-600';
          const bgHover = themeColor === 'emerald' ? 'hover:bg-emerald-700' : 'hover:bg-indigo-700';
          const tabActive = themeColor === 'emerald' ? 'bg-emerald-600 text-white shadow-md' : 'bg-indigo-600 text-white shadow-md';

          return (
            <div className="flex flex-col h-full fade-in">
              
              {/* Header & Tabs */}
              <div className="px-6 md:px-10 pt-8 pb-4 border-b border-slate-100 bg-slate-50/50">
                <div className="hidden md:flex items-center gap-4 mb-6">
                  <span className="text-5xl bg-white w-16 h-16 rounded-2xl shadow-sm flex items-center justify-center border border-slate-100">{lesson.icon}</span>
                  <div>
                    <h1 className={`text-3xl font-black ${tc} font-display`}>{lesson.title}</h1>
                    <div className="flex gap-2 mt-2">
                      {['dok1','dok2','dok3'].map((l,i) => (
                        <div key={l} className={`h-1.5 w-10 rounded-full ${lessonScores[l]===100 ? bgc : (lessonScores[l]>0 ? 'bg-amber-400' : 'bg-slate-200')}`}></div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Pill Tabs */}
                <div className="flex overflow-x-auto hide-scrollbar gap-2 p-1 bg-slate-200/50 rounded-xl max-w-2xl">
                  <button onClick={() => { setActiveTab('theory'); setChecked(false); }} className={`flex-1 min-w-[100px] py-2 px-4 rounded-lg font-bold text-sm transition-all ${activeTab==='theory' ? tabActive : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200'}`}>
                    {ui.theoryTab}
                  </button>
                  {['dok1', 'dok2', 'dok3'].map((lvl, idx) => (
                    <button key={lvl} onClick={() => { setActiveTab(lvl); setChecked(false); setAnswers({}); }} className={`flex-1 min-w-[100px] py-2 px-4 rounded-lg font-bold text-sm transition-all flex items-center justify-center gap-2 ${activeTab===lvl ? tabActive : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200'}`}>
                      Niv {idx+1} {lessonScores[lvl]===100 && <Icons.CheckCircle />}
                    </button>
                  ))}
                </div>
              </div>

              {/* Scrollable Content */}
              <div className="flex-1 overflow-y-auto p-6 md:p-10">
                <div className="max-w-3xl mx-auto pb-20">
                  {activeTab === 'theory' ? (
                    <div className="space-y-4 fade-in">
                      <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2"><Icons.BookOpen /> {ui.rulesTitle}</h2>
                      {lesson.rules.map((rule, idx) => (
                        <div key={idx} className={`p-5 rounded-2xl bg-white border-l-4 ${themeColor==='emerald'?'border-emerald-500':'border-indigo-500'} shadow-sm`}>
                          <div className="flex items-baseline gap-3 mb-2">
                            <span className={`text-2xl font-black ${tc}`}>{rule.word}</span>
                            <span className="text-slate-700 font-medium">{rule.desc}</span>
                          </div>
                          <div className="text-sm font-bold text-slate-500 mt-2 bg-slate-50 inline-block px-3 py-1 rounded-lg">💡 {rule.tip}</div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="fade-in">
                      <div className="mb-8">
                        <h2 className="text-2xl font-bold text-slate-800 font-display">{currentContent.title}</h2>
                        <p className="text-slate-500 font-medium">{currentContent.desc}</p>
                      </div>

                      <div className="space-y-4">
                        {currentContent.questions.map((q, idx) => {
                          const ans = answers[idx];
                          const isRight = ans === q.answer;
                          return (
                            <div key={idx} className={`p-5 rounded-2xl bg-white border ${checked ? (isRight ? 'border-emerald-300 bg-emerald-50/30' : 'border-rose-300 bg-rose-50/30') : 'border-slate-200 hover:border-slate-300'} shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4 transition-colors`}>
                              
                              <div className="text-lg font-bold text-slate-700">
                                {q.text.map((part, pIdx) => (
                                  <React.Fragment key={pIdx}>
                                    <span>{part}</span>
                                    {pIdx < q.text.length - 1 && (
                                      <span className={`mx-2 px-3 py-0.5 border-b-2 font-black transition-colors ${checked ? (isRight ? 'text-emerald-600 border-emerald-500' : 'text-rose-600 border-rose-500 line-through') : (ans ? `${tc} border-slate-800` : 'text-slate-300 border-slate-300')}`}>
                                        {ans || '___'}
                                      </span>
                                    )}
                                  </React.Fragment>
                                ))}
                                {checked && !isRight && <span className="ml-2 text-sm text-emerald-600 font-black bg-emerald-100 px-2 py-1 rounded-md">👉 {q.answer}</span>}
                              </div>

                              {!checked && (
                                <div className="flex gap-2 shrink-0">
                                  {q.options.map((opt, oIdx) => (
                                    <button
                                      key={oIdx}
                                      onClick={() => setAnswers(p => ({...p, [idx]: opt}))}
                                      className={`px-4 py-2 rounded-xl text-sm font-bold transition-transform active:scale-95 ${ans === opt ? `${bgc} text-white shadow-md` : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                    >
                                      {opt}
                                    </button>
                                  ))}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>

                      {/* Check Button Area */}
                      <div className="mt-10 flex justify-center">
                        {!checked ? (
                          <button onClick={handleCheck} disabled={!isComplete} className={`py-4 px-12 rounded-2xl font-black text-lg transition-all transform ${isComplete ? `${bgc} ${bgHover} text-white shadow-xl hover:-translate-y-1` : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                            {ui.checkBtn}
                          </button>
                        ) : (
                          <div className="text-center bg-white p-6 rounded-3xl border border-slate-100 shadow-xl w-full max-w-sm fade-in">
                            <div className={`text-4xl font-black mb-2 font-display ${score === 100 ? 'text-emerald-500' : tc}`}>{score}%</div>
                            <p className="text-slate-500 font-bold mb-6">{score === 100 ? ui.perfect : ui.keepGoing}</p>
                            <button onClick={() => { setChecked(false); setAnswers({}); }} className="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold shadow-md active:scale-95 transition-transform">
                              {ui.retryBtn}
                            </button>
                          </div>
                        )}
                      </div>

                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
